<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 — Cloze · Reflective card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --surface: #f7f5f2; --surface-2: #f0ece6;
  --border: #ddd8d0; --border-subtle: #ece8e2; --border-bright: #b8b0a5;
  --text: #1a1814; --text-2: #6b6560; --text-muted: #a09890;
  --coral: #ff4757; --indigo: #3d5af1; --emerald: #00c48c; --amber: #ffb703; --violet: #8b5cf6;
  --coral-soft: rgba(255, 71, 87, 0.10);
  --indigo-soft: rgba(61, 90, 241, 0.10);
  --emerald-soft: rgba(0, 196, 140, 0.10);
  --amber-soft: rgba(255, 183, 3, 0.14);
  --violet-soft: rgba(139, 92, 246, 0.10);
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --accent: #8b5cf6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.65;
  display: flex; flex-direction: column;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }

.bar { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-subtle); padding: 0.7rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem; }
.bar .back { color: var(--text-2); padding: 0.25rem 0.5rem; border-radius: 6px; }
.bar .back:hover { background: var(--surface); color: var(--text); }
.bar .badge { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); padding: 0.2rem 0.5rem; border: 1px solid var(--border-subtle); border-radius: 999px; }
.bar .label { color: var(--text-2); }
.bar .spacer { flex: 1; }
.bar .counter { color: var(--text-2); font-variant-numeric: tabular-nums; }
.bar .counter b { color: var(--text); font-weight: 500; }

.progress { height: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.progress::after { content: ''; position: absolute; top: 0; left: 0; height: 100%; width: var(--pct, 0%); background: var(--accent); transition: width 0.4s cubic-bezier(0.2, 0.7, 0.2, 1); }

.stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem 1.5rem; }
.card { width: 100%; max-width: 38rem; }

/* ── Sentence card (top) ─────────────────────────────────────── */
.sentence-card {
  padding: 1.75rem 1.5rem 1.5rem;
  background: var(--bg);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  box-shadow: 0 1px 0 rgba(26,24,20,0.02);
  margin-bottom: 1rem;
}

.hints { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 1.25rem; font-size: 0.85rem; color: var(--text-2); flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; padding: 0.3rem 0.65rem; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 999px; color: var(--text-2); }
.chip .k { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 0.35rem; }
.chip strong { color: var(--text); font-weight: 500; }
.arrow { color: var(--text-muted); font-size: 0.8rem; }

.sentence { font-family: var(--font-display); font-size: clamp(1.5rem, 3.8vw, 2rem); font-weight: 500; line-height: 1.5; letter-spacing: -0.01em; color: var(--text); margin-bottom: 1.25rem; min-height: 5rem; display: flex; align-items: center; flex-wrap: wrap; gap: 0.05em; }
.sentence .blank { display: inline-flex; align-items: center; justify-content: center; min-width: 7.5ch; padding: 0.1em 0.5em; border-bottom: 2px dashed var(--text-muted); color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85em; letter-spacing: 0.05em; user-select: none; border-radius: 2px; }
.sentence .blank.correct { color: var(--emerald); background: var(--emerald-soft); border-bottom: 2px solid var(--emerald); border-radius: 4px; font-family: var(--font-display); font-size: 1em; font-weight: 600; }
.sentence .blank.almost  { color: #b07500; background: var(--amber-soft); border-bottom: 2px solid var(--amber); border-radius: 4px; font-family: var(--font-display); font-size: 1em; font-weight: 600; }
.sentence .blank.wrong   { color: var(--coral); background: var(--coral-soft); border-bottom: 2px solid var(--coral); border-radius: 4px; font-family: var(--font-display); font-size: 1em; font-weight: 600; text-decoration: line-through; text-decoration-thickness: 1.5px; }

.input-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
.input { flex: 1; font-family: var(--font-mono); font-size: 1.1rem; padding: 0.85rem 1rem; background: var(--surface); border: 1.5px solid var(--border-subtle); border-radius: 10px; color: var(--text); outline: none; transition: border-color 0.15s, background 0.15s; }
.input:focus { border-color: var(--accent); background: var(--bg); }
.input::placeholder { color: var(--text-muted); }
.input:disabled { opacity: 0.5; }

.submit { display: inline-flex; align-items: center; justify-content: center; padding: 0.85rem 1.25rem; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 500; font-size: 0.95rem; cursor: pointer; min-width: 5rem; }
.submit:hover { opacity: 0.92; }
.submit .kbd { margin-left: 0.5rem; font-family: var(--font-mono); font-size: 0.7rem; padding: 0.1rem 0.4rem; background: rgba(255,255,255,0.18); border-radius: 4px; }

.accents { display: flex; gap: 0.35rem; margin-top: 0.5rem; }
.accent { width: 2.2rem; height: 2.2rem; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1.05rem; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-2); cursor: pointer; }
.accent:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-bright); }

/* ── Reflective card (reveals on submit) ─────────────────────── */
.reflect {
  margin-top: 1rem;
  padding: 1.5rem;
  background: linear-gradient(180deg, var(--violet-soft) 0%, var(--bg) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  opacity: 0;
  transform: translateY(8px) scale(0.99);
  pointer-events: none;
  transition: opacity 0.35s, transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.reflect.shown { opacity: 1; transform: none; pointer-events: auto; }
.reflect .ribbon {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--violet);
  background: rgba(139, 92, 246, 0.12);
  padding: 0.25rem 0.6rem;
  border-radius: 999px;
  margin-bottom: 0.85rem;
  font-weight: 500;
}

.reflect .row {
  display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;
  margin-bottom: 1rem;
}
.reflect .row .label { font-size: 0.8rem; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.08em; }
.reflect .row .yours { font-family: var(--font-mono); color: var(--coral); text-decoration: line-through; }
.reflect .row .arrow { color: var(--text-muted); }
.reflect .row .theirs { font-family: var(--font-mono); color: var(--text); font-weight: 600; }
.reflect .row .theirs b { color: var(--indigo); font-weight: 500; }
.reflect .row .theirs .ending { color: var(--coral); font-weight: 600; }
.reflect .verdict {
  font-size: 0.85rem;
  font-weight: 600;
  padding: 0.2rem 0.55rem;
  border-radius: 999px;
}
.verdict.correct { color: var(--emerald); background: var(--emerald-soft); }
.verdict.almost  { color: #b07500; background: var(--amber-soft); }
.verdict.wrong   { color: var(--coral); background: var(--coral-soft); }

/* ── Mini paradigm table ─────────────────────────────────────── */
.paradigm {
  margin: 1rem 0;
  padding: 0.85rem 0;
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}
.paradigm .ph {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.paradigm .ph .tense-name { color: var(--text-2); font-weight: 500; }
.paradigm .grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 0.25rem 0.5rem;
  font-family: var(--font-mono);
  font-size: 0.9rem;
}
.paradigm .cell { display: flex; flex-direction: column; padding: 0.4rem 0.3rem; border-radius: 6px; }
.paradigm .cell .p { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.1rem; }
.paradigm .cell .f { color: var(--text); font-weight: 500; }
.paradigm .cell .f .ending { color: var(--coral); }
.paradigm .cell .f .stem { color: var(--indigo); }
.paradigm .cell.you { background: var(--violet-soft); }
.paradigm .cell.you .f { font-weight: 600; }
.paradigm .cell.you .f::before { content: '→ '; color: var(--violet); }

.rule { font-size: 0.9rem; color: var(--text-2); margin-top: 0.85rem; line-height: 1.55; }
.rule code { font-family: var(--font-mono); background: rgba(61, 90, 241, 0.08); color: var(--indigo); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.85em; }

.continue-row { display: flex; justify-content: flex-end; margin-top: 1.25rem; }
.continue { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.4rem; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 500; font-size: 0.95rem; cursor: pointer; text-decoration: none; }
.continue .kbd { font-family: var(--font-mono); font-size: 0.7rem; padding: 0.1rem 0.4rem; background: rgba(255,255,255,0.18); border-radius: 4px; font-weight: 400; }

.summary { text-align: center; padding: 2rem 0; }
.summary h2 { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
.summary p { color: var(--text-2); margin-bottom: 1.5rem; }
.summary .stats { display: inline-flex; gap: 1.5rem; margin-bottom: 1.5rem; }
.summary .stat .n { font-family: var(--font-display); font-size: 2rem; font-weight: 600; display: block; }
.summary .stat .l { font-size: 0.8rem; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.08em; }
.summary .note { font-size: 0.9rem; color: var(--text-2); max-width: 32rem; margin: 0 auto 1.5rem; line-height: 1.6; }

.foot { text-align: center; font-size: 0.8rem; color: var(--text-muted); padding: 1.5rem; border-top: 1px solid var(--border-subtle); }

@media (max-width: 640px) {
  .stage { padding: 1.5rem 1.25rem; align-items: flex-start; }
  .sentence { font-size: 1.3rem; }
  .input-row { flex-direction: column; align-items: stretch; }
  .submit { width: 100%; }
  .paradigm .grid { grid-template-columns: repeat(3, 1fr); font-size: 0.8rem; }
}
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="index.html">← prototypes</a>
  <span class="badge">03 · Cloze C</span>
  <span class="label">Reflective card</span>
  <span class="spacer"></span>
  <span class="counter"><b id="counter">1</b> / <span id="total">6</span></span>
</div>
<div class="progress" id="progress"></div>

<main class="stage">
  <div class="card" id="card"></div>
</main>

<div class="foot">Two steps: answer first, then the pattern reveals. Patterns stick when you see the rule alongside the form.</div>

<script>
// ── Items with full paradigm (6 persons) ───────────────────────
const ITEMS = [
  { verb: "parler",  person: "je",   tense: "imparfait", tenseName: "imparfait",
    sentence: ["Quand j'étais petit, ", "_", " beaucoup avec mes amis."],
    answer: "parlais", stem: "parl", ending: "ais",
    paradigm: { je: "parlais", tu: "parlais", il: "parlait", nous: "parlions", vous: "parliez", ils: "parlaient" },
    rule: "<code>-er</code> imparfait: stem <code>parl-</code> + <code>-ais · -ait · -ions · -iez · -aient</code>." },
  { verb: "aller",   person: "il",   tense: "imparfait", tenseName: "imparfait",
    sentence: ["Chaque matin, il ", "_", " à l'école à pied."],
    answer: "allait", stem: "all", ending: "ait",
    paradigm: { je: "allais", tu: "allais", il: "allait", nous: "allions", vous: "alliez", ils: "allaient" },
    rule: "<code>aller</code> is irregular: <code>all-</code> + imparfait endings (not <code>aller-</code>)." },
  { verb: "finir",   person: "tu",   tense: "présent",   tenseName: "présent",
    sentence: ["Tu ", "_", " toujours tes devoirs avant de jouer."],
    answer: "finis", stem: "fin", ending: "is",
    paradigm: { je: "finis", tu: "finis", il: "finit", nous: "finissons", vous: "finissez", ils: "finissent" },
    rule: "<code>-ir</code> like <code>finir</code>: <code>-is · -is · -it · -issons · -issez · -issent</code>." },
  { verb: "avoir",   person: "je",   tense: "présent",   tenseName: "présent",
    sentence: ["J'", "_", " faim, on mange quelque chose ?"],
    answer: "ai", stem: "ai", ending: "",
    paradigm: { je: "ai", tu: "as", il: "a", nous: "avons", vous: "avez", ils: "ont" },
    rule: "<code>avoir</code> is one of the most irregular verbs. Memorize the full set." },
  { verb: "venir",   person: "ils",  tense: "imparfait", tenseName: "imparfait",
    sentence: ["Les étés, ils ", "_", " souvent chez leurs grands-parents."],
    answer: "venaient", stem: "ven", ending: "aient",
    paradigm: { je: "venais", tu: "venais", il: "venait", nous: "venions", vous: "veniez", ils: "venaient" },
    rule: "<code>venir</code> imparfait: <code>ven-</code> + imparfait endings. <code>ten-</code>, <code>ren-</code> follow the same pattern." },
  { verb: "faire",   person: "vous", tense: "passé composé", tenseName: "passé composé",
    sentence: ["Qu'est-ce que vous ", "_", " ce week-end ?"],
    answer: "avez fait", stem: "avez f", ending: "ait",
    paradigm: { je: "ai fait", tu: "as fait", il: "a fait", nous: "avons fait", vous: "avez fait", ils: "ont fait" },
    rule: "passé composé of <code>faire</code>: <code>avoir</code> + <code>fait</code> (irregular participle)." },
];

const PERSONS = ["je", "tu", "il", "nous", "vous", "ils"];

let idx = 0, phase = "answer";
let verdict = null;
let stats = { correct: 0, almost: 0, wrong: 0 };
let history = [];

const card = document.getElementById("card");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const progress = document.getElementById("progress");
total.textContent = ITEMS.length;

function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim(); }
function isAlmost(a, b) {
  a = norm(a); b = norm(b);
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n] <= 1;
}

function splitForm(form, stem, ending) {
  // Color-code stem and ending
  if (!ending) return form;
  const idx = form.toLowerCase().lastIndexOf(ending.toLowerCase());
  if (idx === -1) return form;
  return `<span class="stem">${form.slice(0, idx)}</span><span class="ending">${form.slice(idx)}</span>`;
}

function render() {
  if (idx >= ITEMS.length) return renderSummary();
  const item = ITEMS[idx];
  counter.textContent = idx + 1;
  progress.style.setProperty("--pct", `${(idx / ITEMS.length) * 100}%`);

  let blankHTML;
  if (phase === "answer") blankHTML = `<span class="blank" id="blank">____</span>`;
  else {
    const cls = verdict === "correct" ? "correct" : verdict === "almost" ? "almost" : "wrong";
    blankHTML = `<span class="blank ${cls}">${item.answer}</span>`;
  }

  const sentenceHTML = `<span>${item.sentence[0]}</span>${blankHTML}<span>${item.sentence[2]}</span>`;

  let reflectHTML = "";
  if (phase === "feedback") {
    const cls = verdict;
    const tried = history[idx] || "";
    const verdictText = verdict === "correct" ? "correct" : verdict === "almost" ? "almost" : "not quite";
    const diffRow = verdict !== "correct"
      ? `<div class="row">
           <span class="label">you</span>
           <span class="yours">${tried}</span>
           <span class="arrow">→</span>
           <span class="theirs">${splitForm(item.answer, item.stem, item.ending)}</span>
         </div>`
      : `<div class="row">
           <span class="verdict ${cls}">${verdictText}</span>
           <span class="theirs">${splitForm(item.answer, item.stem, item.ending)}</span>
         </div>`;

    // On CORRECT: show just the row (no paradigm overload). On WRONG/ALMOST:
    // show the full paradigm — they need the pattern.
    const showParadigm = verdict !== "correct";
    const paradigmHTML = showParadigm ? PERSONS.map(p => {
      const form = item.paradigm[p];
      let colored = form;
      if (item.ending && form.toLowerCase().endsWith(item.ending.toLowerCase())) {
        const i = form.length - item.ending.length;
        colored = `<span class="stem">${form.slice(0, i)}</span><span class="ending">${form.slice(i)}</span>`;
      }
      return `<div class="cell ${p === item.person ? 'you' : ''}">
                <span class="p">${p}</span>
                <span class="f">${colored}</span>
              </div>`;
    }).join("") : "";

    const paradigmBlock = showParadigm ? `
      <div class="paradigm">
        <div class="ph">
          <span>paradigm</span>
          <span class="tense-name">· ${item.verb} · ${item.tenseName}</span>
        </div>
        <div class="grid">${paradigmHTML}</div>
      </div>
    ` : "";

    reflectHTML = `
      <div class="reflect shown">
        <div class="ribbon">${showParadigm ? '↻ the pattern' : '↻ for next time'}</div>
        ${diffRow}
        ${paradigmBlock}
        <div class="rule">${item.rule}</div>
        <div class="continue-row">
          <button class="continue" id="continue">continue <span class="kbd">↵</span></button>
        </div>
      </div>
    `;
  }

  card.innerHTML = `
    <div class="sentence-card">
      <div class="hints">
        <span class="chip"><span class="k">verb</span><strong>${item.verb}</strong></span>
        <span class="arrow">·</span>
        <span class="chip"><span class="k">person</span><strong>${item.person}</strong></span>
        <span class="arrow">·</span>
        <span class="chip"><span class="k">tense</span><strong>${item.tense}</strong></span>
      </div>
      <div class="sentence">${sentenceHTML}</div>
      ${phase === "answer" ? `
        <div class="input-row">
          <input class="input" id="answer" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the conjugated form" autofocus />
          <button class="submit" id="submit">check <span class="kbd">↵</span></button>
        </div>
        <div class="accents">
          <button class="accent" data-c="é">é</button>
          <button class="accent" data-c="è">è</button>
          <button class="accent" data-c="ê">ê</button>
          <button class="accent" data-c="à">à</button>
          <button class="accent" data-c="ù">ù</button>
          <button class="accent" data-c="ç">ç</button>
          <button class="accent" data-c="ô">ô</button>
          <button class="accent" data-c="î">î</button>
          <button class="accent" data-c="ë">ë</button>
        </div>
      ` : ""}
    </div>
    ${reflectHTML}
  `;

  if (phase === "answer") {
    const input = document.getElementById("answer");
    const submit = document.getElementById("submit");
    input.focus();
    const handle = () => {
      const v = input.value.trim();
      if (!v) return;
      history[idx] = v;
      const exact = v.toLowerCase() === item.answer;
      const almost = !exact && isAlmost(v, item.answer);
      if (exact) { verdict = "correct"; stats.correct++; }
      else if (almost) { verdict = "almost"; stats.almost++; }
      else { verdict = "wrong"; stats.wrong++; }
      phase = "feedback";
      render();
    };
    submit.addEventListener("click", handle);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); handle(); } });
    document.querySelectorAll(".accent").forEach(btn => {
      btn.addEventListener("click", () => {
        const c = btn.dataset.c;
        const s = input.selectionStart || input.value.length;
        const e = input.selectionEnd || input.value.length;
        input.value = input.value.slice(0, s) + c + input.value.slice(e);
        input.focus();
        input.setSelectionRange(s + 1, s + 1);
      });
    });
  } else {
    const cont = document.getElementById("continue");
    if (cont) { cont.focus(); cont.addEventListener("click", next); }
  }
}

function next() { idx++; phase = "answer"; verdict = null; render(); }

function renderSummary() {
  progress.style.setProperty("--pct", "100%");
  card.innerHTML = `
    <div class="summary">
      <h2>Done.</h2>
      <p>You saw the pattern for each item, not just the form.</p>
      <div class="stats">
        <div class="stat"><span class="n" style="color:var(--emerald)">${stats.correct}</span><span class="l">correct</span></div>
        <div class="stat"><span class="n" style="color:#b07500">${stats.almost}</span><span class="l">almost</span></div>
        <div class="stat"><span class="n" style="color:var(--coral)">${stats.wrong}</span><span class="l">wrong</span></div>
      </div>
      <p class="note">The reflection card shows the full 6-person paradigm every time. Over a session, this builds a mental map of each tense — what you saw transfers better than what you just read.</p>
      <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
        <a class="continue" href="3-cloze-reflective-card.html">try again</a>
        <a class="continue" style="background:var(--surface); color:var(--text)" href="4-cue-to-form.html">next: cue-to-form →</a>
      </div>
    </div>
  `;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && phase === "feedback") {
    e.preventDefault();
    next();
  }
});

render();
</script>
</body>
</html>
