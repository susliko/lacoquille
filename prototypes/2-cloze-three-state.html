<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 — Cloze · Three-state + retyping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --surface: #f7f5f2; --surface-2: #f0ece6;
  --border: #ddd8d0; --border-subtle: #ece8e2; --border-bright: #b8b0a5;
  --text: #1a1814; --text-2: #6b6560; --text-muted: #a09890;
  --coral: #ff4757; --indigo: #3d5af1; --emerald: #00c48c; --amber: #ffb703;
  --coral-soft: rgba(255, 71, 87, 0.10);
  --indigo-soft: rgba(61, 90, 241, 0.10);
  --emerald-soft: rgba(0, 196, 140, 0.10);
  --amber-soft: rgba(255, 183, 3, 0.14);
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --accent: #ffb703;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.65;
  display: flex; flex-direction: column;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }

.bar {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0.7rem 1.25rem;
  display: flex; align-items: center; gap: 0.75rem;
  font-size: 0.85rem;
}
.bar .back { color: var(--text-2); padding: 0.25rem 0.5rem; border-radius: 6px; }
.bar .back:hover { background: var(--surface); color: var(--text); }
.bar .badge { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); padding: 0.2rem 0.5rem; border: 1px solid var(--border-subtle); border-radius: 999px; }
.bar .label { color: var(--text-2); }
.bar .spacer { flex: 1; }
.bar .counter { color: var(--text-2); font-variant-numeric: tabular-nums; }
.bar .counter b { color: var(--text); font-weight: 500; }

.progress { height: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.progress::after { content: ''; position: absolute; top: 0; left: 0; height: 100%; width: var(--pct, 0%); background: var(--accent); transition: width 0.4s cubic-bezier(0.2, 0.7, 0.2, 1); }

.stage { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1.5rem 1.5rem; }
.card { width: 100%; max-width: 38rem; }

.hints { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 1.5rem; font-size: 0.85rem; color: var(--text-2); flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; padding: 0.3rem 0.65rem; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 999px; color: var(--text-2); }
.chip .k { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 0.35rem; }
.chip strong { color: var(--text); font-weight: 500; }
.arrow { color: var(--text-muted); font-size: 0.8rem; }

.sentence {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3.8vw, 2rem);
  font-weight: 500;
  line-height: 1.5;
  letter-spacing: -0.01em;
  color: var(--text);
  margin-bottom: 1.25rem;
  min-height: 5.5rem;
  display: flex; align-items: center; flex-wrap: wrap; gap: 0.05em;
}
.sentence .blank {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 7.5ch;
  padding: 0.1em 0.5em;
  border-bottom: 2px dashed var(--text-muted);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 0.85em;
  letter-spacing: 0.05em;
  user-select: none;
  border-radius: 2px;
}
.sentence .blank.correct { color: var(--emerald); background: var(--emerald-soft); border-bottom: 2px solid var(--emerald); border-radius: 4px; font-family: var(--font-display); font-size: 1em; font-weight: 600; }
.sentence .blank.almost  { color: #b07500; background: var(--amber-soft); border-bottom: 2px solid var(--amber); border-radius: 4px; font-family: var(--font-display); font-size: 1em; font-weight: 600; }
.sentence .blank.wrong   { color: var(--coral); background: var(--coral-soft); border-bottom: 2px solid var(--coral); border-radius: 4px; font-family: var(--font-display); font-size: 1em; font-weight: 600; text-decoration: line-through; text-decoration-thickness: 1.5px; }

.input-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; }
.input { flex: 1; font-family: var(--font-mono); font-size: 1.1rem; padding: 0.85rem 1rem; background: var(--surface); border: 1.5px solid var(--border-subtle); border-radius: 10px; color: var(--text); outline: none; transition: border-color 0.15s, background 0.15s; }
.input:focus { border-color: var(--accent); background: var(--bg); }
.input::placeholder { color: var(--text-muted); }
.input:disabled { opacity: 0.5; cursor: not-allowed; }
.input.retry { border-color: var(--coral); background: #fff5f6; }

.submit { display: inline-flex; align-items: center; justify-content: center; padding: 0.85rem 1.25rem; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 500; font-size: 0.95rem; cursor: pointer; min-width: 5rem; transition: opacity 0.15s, transform 0.05s; }
.submit:hover { opacity: 0.92; }
.submit:active { transform: translateY(1px); }
.submit:disabled { opacity: 0.4; cursor: not-allowed; }
.submit .kbd { margin-left: 0.5rem; font-family: var(--font-mono); font-size: 0.7rem; padding: 0.1rem 0.4rem; background: rgba(255,255,255,0.18); border-radius: 4px; }

.accents { display: flex; gap: 0.35rem; margin-bottom: 1.5rem; }
.accent { width: 2.2rem; height: 2.2rem; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1.05rem; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-2); cursor: pointer; transition: all 0.15s; }
.accent:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-bright); }
.accent:active { transform: scale(0.95); }

/* ── Feedback panel (under the sentence) ─────────────────────── */
.feedback {
  margin-top: 1.5rem;
  padding: 1.1rem 1.25rem;
  border-radius: 10px;
  border: 1px solid var(--border-subtle);
  background: var(--surface);
  display: none;
  animation: slideIn 0.25s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.feedback.shown { display: block; }
@keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.feedback.correct { background: var(--emerald-soft); border-color: rgba(0,196,140,0.3); }
.feedback.almost  { background: var(--amber-soft); border-color: rgba(255,183,3,0.4); }
.feedback.wrong   { background: var(--coral-soft); border-color: rgba(255,71,87,0.3); }

.feedback .verdict { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
.feedback.correct .verdict { color: var(--emerald); }
.feedback.almost  .verdict { color: #b07500; }
.feedback.wrong   .verdict { color: var(--coral); }

.feedback .diff { font-family: var(--font-mono); font-size: 1rem; margin: 0.5rem 0; }
.feedback .diff .yours { color: var(--coral); text-decoration: line-through; text-decoration-thickness: 1.5px; margin-right: 0.5rem; }
.feedback .diff .arrow { color: var(--text-muted); margin-right: 0.5rem; }
.feedback .diff .correct { color: var(--emerald); font-weight: 600; }

.feedback .decomp { display: inline-flex; align-items: center; gap: 0.3rem; font-family: var(--font-mono); font-size: 0.95rem; margin: 0.3rem 0 0.6rem; }
.feedback .decomp .stem { color: var(--indigo); font-weight: 500; }
.feedback .decomp .plus { color: var(--text-muted); }
.feedback .decomp .ending { color: var(--coral); font-weight: 600; }

.feedback .rule { font-size: 0.9rem; color: var(--text-2); margin-top: 0.3rem; }
.feedback .rule code { font-family: var(--font-mono); background: rgba(61, 90, 241, 0.08); color: var(--indigo); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.85em; }

.retry-row { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle); }
.retry-row .label { font-size: 0.85rem; color: var(--text-2); margin-bottom: 0.5rem; display: block; }
.retry-row .label b { color: var(--text); font-weight: 500; }
.retry-row .input-row { margin-bottom: 0; }

.continue-row { display: flex; justify-content: flex-end; margin-top: 1rem; min-height: 3rem; }
.continue { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.4rem; background: var(--text); color: var(--bg); border: none; border-radius: 10px; font-weight: 500; font-size: 0.95rem; cursor: pointer; opacity: 0; pointer-events: none; transform: translateY(4px); transition: opacity 0.2s, transform 0.2s; text-decoration: none; }
.continue.shown { opacity: 1; pointer-events: auto; transform: none; }
.continue .kbd { font-family: var(--font-mono); font-size: 0.7rem; padding: 0.1rem 0.4rem; background: rgba(255,255,255,0.18); border-radius: 4px; font-weight: 400; }
.continue.light { background: var(--accent); }

.summary { text-align: center; padding: 2rem 0; }
.summary h2 { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
.summary p { color: var(--text-2); margin-bottom: 1.5rem; }
.summary .stats { display: inline-flex; gap: 1.5rem; margin-bottom: 1.5rem; }
.summary .stat .n { font-family: var(--font-display); font-size: 2rem; font-weight: 600; display: block; }
.summary .stat .l { font-size: 0.8rem; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.08em; }
.summary .note { font-size: 0.85rem; color: var(--text-2); max-width: 30rem; margin: 0 auto 1.5rem; line-height: 1.6; }

.foot { text-align: center; font-size: 0.8rem; color: var(--text-muted); padding: 1.5rem; border-top: 1px solid var(--border-subtle); }

@media (max-width: 600px) {
  .stage { padding: 1.5rem 1.25rem; }
  .sentence { font-size: 1.3rem; min-height: 4.5rem; }
  .input-row { flex-direction: column; align-items: stretch; }
  .submit { width: 100%; }
}
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="index.html">← prototypes</a>
  <span class="badge">02 · Cloze B</span>
  <span class="label">Three-state + retyping</span>
  <span class="spacer"></span>
  <span class="counter"><b id="counter">1</b> / <span id="total">8</span></span>
</div>
<div class="progress" id="progress"></div>

<main class="stage">
  <div class="card" id="card"></div>
</main>

<div class="foot">Enter to submit · after a wrong answer, type the correct form to continue (it's a second retrieval)</div>

<script>
const ITEMS = [
  { hint: { verb: "parler", person: "je",   tense: "imparfait" },
    sentence: ["Quand j'étais petit, ", "_", " beaucoup avec mes amis."],
    answer: "parlais", stem: "parl", ending: "ais",
    rule: "<code>-er</code> imparfait: stem <code>parl-</code> + <code>-ais, -ait, -ions, -iez, -aient</code>" },
  { hint: { verb: "aller",  person: "il",   tense: "imparfait" },
    sentence: ["Chaque matin, il ", "_", " à l'école à pied."],
    answer: "allait", stem: "all", ending: "ait",
    rule: "<code>aller</code> is irregular in the imparfait: <code>j'allais, tu allais, il allait, nous allions…</code>" },
  { hint: { verb: "finir",  person: "tu",   tense: "présent" },
    sentence: ["Tu ", "_", " toujours tes devoirs avant de jouer."],
    answer: "finis", stem: "fin", ending: "is",
    rule: "<code>-ir</code> verbs like <code>finir</code> take <code>-is, -is, -it, -issons, -issez, -issent</code>" },
  { hint: { verb: "manger", person: "nous", tense: "passé composé" },
    sentence: ["Hier soir, nous ", "_", " au restaurant italien."],
    answer: "avons mangé", stem: "avons mang", ending: "é",
    rule: "passé composé with <code>avoir</code>: <code>avoir</code> conjugated + past participle. <code>manger</code> → <code>mangé</code>" },
  { hint: { verb: "être",   person: "elle", tense: "imparfait" },
    sentence: ["Elle ", "_", " très timide quand elle était enfant."],
    answer: "était", stem: "ét", ending: "ait",
    rule: "<code>être</code> imparfait: <code>j'étais, tu étais, il était…</code> — note the circumflex on the stem" },
  { hint: { verb: "avoir",  person: "je",   tense: "présent" },
    sentence: ["J'", "_", " faim, on mange quelque chose ?"],
    answer: "ai", stem: "ai", ending: "",
    rule: "<code>avoir</code> présent: <code>j'ai, tu as, il a, nous avons, vous avez, ils ont</code>" },
  { hint: { verb: "faire",  person: "vous", tense: "passé composé" },
    sentence: ["Qu'est-ce que vous ", "_", " ce week-end ?"],
    answer: "avez fait", stem: "avez f", ending: "ait",
    rule: "<code>faire</code> past participle is <code>fait</code> (irregular). passé composé: <code>avoir</code> + <code>fait</code>" },
  { hint: { verb: "venir",  person: "ils",  tense: "imparfait" },
    sentence: ["Les étés, ils ", "_", " souvent chez leurs grands-parents."],
    answer: "venaient", stem: "ven", ending: "aient",
    rule: "<code>venir</code> imparfait: double-i stem <code>ven-</code> + imparfait endings. <code>venais, venait, venions, veniez, venaient</code>" },
];

let idx = 0, phase = "answer";
let verdict = null, firstTry = true;
let stats = { firstTry: 0, almost: 0, wrong: 0, retypeOk: 0 };
let history = [];

const card = document.getElementById("card");
const counter = document.getElementById("counter");
const total = document.getElementById("total");
const progress = document.getElementById("progress");
total.textContent = ITEMS.length;

function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim(); }
function isAlmost(a, b) {
  a = norm(a); b = norm(b);
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n] <= 1;
}

function render() {
  if (idx >= ITEMS.length) return renderSummary();
  const item = ITEMS[idx];
  counter.textContent = idx + 1;
  progress.style.setProperty("--pct", `${(idx / ITEMS.length) * 100}%`);

  const h = item.hint;
  let blankHTML, sentenceHTML;
  if (phase === "answer") {
    blankHTML = `<span class="blank" id="blank">____</span>`;
  } else {
    const cls = verdict === "correct" ? "correct" : verdict === "almost" ? "almost" : "wrong";
    blankHTML = `<span class="blank ${cls}">${item.answer}</span>`;
  }
  sentenceHTML = `<span>${item.sentence[0]}</span>${blankHTML}<span>${item.sentence[2]}</span>`;

  let feedbackHTML = "";
  if (phase === "feedback" || phase === "retry" || phase === "retry-feedback") {
    const cls = phase === "retry-feedback" ? "correct" : verdict;
    // On CORRECT, show a minimal feedback (no rule, no decomp) — they got it.
    // On ALMOST/WRONG, show the diff and the rule.
    // On RETRY-FEEDBACK, celebrate the recovery (Peak-End).
    let decompHTML = "";
    let diffHTML = "";
    let ruleHTML = "";
    let verdictText = "";
    if (phase === "retry-feedback") {
      verdictText = "✓ nice recovery — retype done";
    } else if (verdict === "correct") {
      verdictText = "✓ correct";
      decompHTML = item.ending
        ? `<div class="decomp"><span class="stem">${item.stem}</span><span class="plus">+</span><span class="ending">-${item.ending}</span></div>`
        : "";
    } else if (verdict === "almost") {
      verdictText = "almost — " + (history[idx] && norm(history[idx]) === norm(item.answer) ? "watch the accent" : "one letter off");
      const tried = history[idx] || "";
      diffHTML = `<div class="diff"><span class="yours">${tried}</span><span class="arrow">→</span><span class="correct">${item.answer}</span></div>`;
      ruleHTML = `<div class="rule">${item.rule}</div>`;
    } else {
      verdictText = "not quite — type the correct form below";
      const tried = history[idx] || "";
      diffHTML = `<div class="diff"><span class="yours">${tried}</span><span class="arrow">→</span><span class="correct">${item.answer}</span></div>`;
      ruleHTML = `<div class="rule">${item.rule}</div>`;
    }

    let retryHTML = "";
    if (phase === "feedback" && verdict === "wrong") {
      retryHTML = `
        <div class="retry-row">
          <span class="label">Retype <b>${item.answer}</b> to continue ↓</span>
          <div class="input-row">
            <input class="input retry" id="retry" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type: ${item.answer}" />
            <button class="submit" id="retry-submit">submit <span class="kbd">↵</span></button>
          </div>
        </div>
      `;
    }
    feedbackHTML = `
      <div class="feedback ${cls} shown">
        <div class="verdict">${verdictText}</div>
        ${diffHTML}
        ${decompHTML}
        ${ruleHTML}
        ${retryHTML}
      </div>
    `;
  }

  let bottomHTML = "";
  if (phase === "feedback" && verdict !== "wrong") {
    bottomHTML = `<div class="continue-row"><button class="continue shown" id="continue">continue <span class="kbd">↵</span></button></div>`;
  } else if (phase === "retry-feedback") {
    bottomHTML = `<div class="continue-row"><button class="continue shown" id="continue">continue <span class="kbd">↵</span></button></div>`;
  }

  card.innerHTML = `
    <div class="hints">
      <span class="chip"><span class="k">verb</span><strong>${h.verb}</strong></span>
      <span class="arrow">·</span>
      <span class="chip"><span class="k">person</span><strong>${h.person}</strong></span>
      <span class="arrow">·</span>
      <span class="chip"><span class="k">tense</span><strong>${h.tense}</strong></span>
    </div>
    <div class="sentence">${sentenceHTML}</div>
    ${phase === "answer" ? `
      <div class="input-row">
        <input class="input" id="answer" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the conjugated form" autofocus />
        <button class="submit" id="submit">check <span class="kbd">↵</span></button>
      </div>
      <div class="accents" id="accents">
        <button class="accent" data-c="é">é</button>
        <button class="accent" data-c="è">è</button>
        <button class="accent" data-c="ê">ê</button>
        <button class="accent" data-c="à">à</button>
        <button class="accent" data-c="ù">ù</button>
        <button class="accent" data-c="ç">ç</button>
        <button class="accent" data-c="ô">ô</button>
        <button class="accent" data-c="î">î</button>
        <button class="accent" data-c="ë">ë</button>
      </div>
    ` : ""}
    ${feedbackHTML}
    ${bottomHTML}
  `;

  if (phase === "answer") {
    const input = document.getElementById("answer");
    const submit = document.getElementById("submit");
    input.focus();
    const handleSubmit = () => {
      if (!input.value.trim()) return;
      const v = input.value.trim();
      history[idx] = v;
      const exact = v.toLowerCase() === item.answer;
      const almost = !exact && isAlmost(v, item.answer);
      if (exact) { verdict = "correct"; stats.firstTry++; }
      else if (almost) { verdict = "almost"; stats.almost++; }
      else { verdict = "wrong"; stats.wrong++; }
      phase = "feedback";
      render();
    };
    submit.addEventListener("click", handleSubmit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); handleSubmit(); }
    });
    document.querySelectorAll(".accent").forEach(btn => {
      btn.addEventListener("click", () => {
        const c = btn.dataset.c;
        const s = input.selectionStart || input.value.length;
        const e = input.selectionEnd || input.value.length;
        input.value = input.value.slice(0, s) + c + input.value.slice(e);
        input.focus();
        input.setSelectionRange(s + 1, s + 1);
      });
    });
  } else if (phase === "feedback" && verdict === "wrong") {
    const retry = document.getElementById("retry");
    const retrySubmit = document.getElementById("retry-submit");
    retry.focus();
    const handle = () => {
      const v = retry.value.trim();
      if (!v) return;
      const exact = v.toLowerCase() === item.answer;
      if (exact) {
        stats.retypeOk++;
        phase = "retry-feedback";
        render();
      } else {
        retry.classList.add("retry");
        retry.select();
      }
    };
    retrySubmit.addEventListener("click", handle);
    retry.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); handle(); } });
  } else {
    const cont = document.getElementById("continue");
    if (cont) { cont.focus(); cont.addEventListener("click", next); }
  }
}

function next() { idx++; phase = "answer"; verdict = null; render(); }

function renderSummary() {
  progress.style.setProperty("--pct", "100%");
  const total = stats.firstTry + stats.almost + stats.wrong;
  const firstTryPct = Math.round((stats.firstTry / total) * 100);
  card.innerHTML = `
    <div class="summary">
      <h2>Session complete.</h2>
      <p>You answered <b>${stats.firstTry}</b> of ${total} on the first try. ${stats.wrong} were retyped correctly.</p>
      <div class="stats">
        <div class="stat"><span class="n" style="color:var(--emerald)">${stats.firstTry}</span><span class="l">first-try</span></div>
        <div class="stat"><span class="n" style="color:#b07500">${stats.almost}</span><span class="l">almost</span></div>
        <div class="stat"><span class="n" style="color:var(--coral)">${stats.wrong}</span><span class="l">wrong → retype</span></div>
        <div class="stat"><span class="n" style="color:var(--emerald)">${stats.retypeOk}</span><span class="l">retyped OK</span></div>
      </div>
      <p class="note">First-try rate: <b>${firstTryPct}%</b>. The retype step is a second retrieval — the items you retyped will be scheduled to come back soon.</p>
      <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
        <a class="continue shown" href="2-cloze-three-state.html">try again</a>
        <a class="continue shown" style="background:var(--surface); color:var(--text)" href="3-cloze-reflective-card.html">next: reflective card →</a>
      </div>
    </div>
  `;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (phase === "feedback" && verdict !== "wrong" || phase === "retry-feedback")) {
    e.preventDefault();
    next();
  }
});

render();
</script>
</body>
</html>
