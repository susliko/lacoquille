<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Knowledge · 1 Manuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── tokens (from src/styles/tokens.css) ─────────────────── */
:root{
  color-scheme:light;
  --paper:#F6F4EF; --card:#FFFFFF; --ink:#1F1D18; --muted:#6E6A60;
  --faint:#9B968A; --chip:#EBE8E0; --line:#DFDBD2;
  --p2:#4A5AA8;
  --accent:var(--p2); --accent-soft:#E9EDF8; --accent-ink:#2F3E78;
  --focus-ring:#2F3E78;
  --review-text:#A84314; --no-bg:#F9E9DF; --no-ink:#8F3A0D;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-display:30px; --t-xl:23px; --t-md:16px; --t-base:14px;
  --t-sm:13px; --t-xs:12px; --t-2xs:11px;
  --r-sm:7px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:22px;
  --shadow-1:0 1px 2px rgba(31,29,24,.08);
  --ease:cubic-bezier(.2,0,0,1);
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#ECEAE3;color:var(--ink);font-family:var(--font);font-size:var(--t-md);line-height:1.6;font-weight:400}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-2px;border-radius:4px}

#app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--paper);
     border-inline:1px solid var(--line);position:relative;padding-bottom:40px}
@media(max-width:430px){#app{border-inline:0}}

.proto-pill{position:fixed;bottom:14px;right:14px;z-index:50;background:var(--ink);color:#fff;
  font-size:var(--t-xs);font-weight:700;padding:9px 14px;border-radius:var(--r-pill);
  box-shadow:0 4px 14px rgba(31,29,24,.3)}
.proto-pill:hover{background:#000}

.screen{animation:in .22s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── header ──────────────────────────────────────────────── */
.head{padding:26px var(--s-4) 0}
.head h1{font-size:var(--t-display);font-weight:800;letter-spacing:-.02em;line-height:1.1}

/* ── sticky zone: search + tabs ──────────────────────────── */
.stickyzone{position:sticky;top:0;z-index:20;background:var(--paper);
            padding:14px var(--s-4) 10px;border-bottom:1px solid var(--line)}
.searchrow{display:flex;align-items:center;gap:10px;background:var(--card);
           border:1.5px solid var(--line);border-radius:var(--r-lg);padding:0 12px;height:44px;
           transition:border-color .15s}
.searchrow:focus-within{border-color:var(--accent)}
.searchrow svg{flex:none;opacity:.45}
.searchrow input{flex:1;border:0;outline:0;background:transparent;font-size:var(--t-base);font-weight:600;
                 font-family:var(--font);color:var(--ink);min-width:0}
.searchrow input::placeholder{color:var(--faint);font-weight:500}
.kbd{flex:none;font-size:var(--t-2xs);font-weight:800;color:var(--faint);border:1px solid var(--line);
     border-bottom-width:2px;border-radius:6px;padding:2px 7px;background:var(--paper)}
.clear{flex:none;display:none;width:26px;height:26px;border-radius:50%;background:var(--chip);
       color:var(--muted);font-size:var(--t-xs);font-weight:800;line-height:1}
.searchrow.hasq .clear{display:block}
.searchrow.hasq .kbd{display:none}
mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 2px}

.tabbar{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:var(--r-pill);margin-top:10px}
.tab{flex:1;text-align:center;padding:8px 0;border-radius:var(--r-pill);
     font-size:var(--t-sm);font-weight:700;color:var(--muted);
     transition:background .15s var(--ease),color .15s var(--ease)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}

/* ── chapter ─────────────────────────────────────────────── */
.chapter{padding:var(--s-5) var(--s-4) var(--s-3)}
.chapter h2{font-size:var(--t-xl);font-weight:800;letter-spacing:-.01em}

/* ── parts + lesson rows ─────────────────────────────────── */
.part{margin:0 var(--s-4) var(--s-2)}
.part-h{padding:16px 2px 6px}
.part-h .pt{font-size:var(--t-xs);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lessons{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
         overflow:hidden;box-shadow:var(--shadow-1)}
.lesson{display:flex;align-items:center;width:100%;text-align:left;min-height:52px;
        padding:11px 14px;border-bottom:1px solid var(--line);transition:background .12s}
.lesson:last-child{border-bottom:0}
.lesson:hover{background:#FBFAF7}
.lesson:active{background:var(--accent-soft)}
.lesson .tt{font-size:var(--t-base);font-weight:600;line-height:1.35}
.lesson .tt.soon{color:var(--faint)}

/* search results: flat list, same row */
.results{padding:0 var(--s-4) var(--s-5)}
.results .lessons{margin-top:var(--s-3)}
.empty{padding:48px 24px;text-align:center;color:var(--faint)}
.empty b{display:block;color:var(--muted);font-size:var(--t-md);margin-bottom:4px}

/* ── lesson sheet (topic page) ───────────────────────────── */
.sheet-head{padding:18px var(--s-4) 0}
.backrow{display:flex;justify-content:space-between;align-items:center}
.back{font-size:var(--t-sm);font-weight:700;color:var(--accent-ink);padding:8px 12px 8px 0}
.sheet-head h2{font-size:var(--t-display);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:8px 0 10px}
.metachips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.metachips span{font-size:var(--t-xs);font-weight:800;background:var(--chip);border-radius:var(--r-sm);
                padding:2px 8px;color:var(--muted)}
.metachips span.lit{background:var(--ink);color:#fff}
.sheet-body{padding:var(--s-4)}
.rule{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:var(--s-4);margin-bottom:var(--s-3);box-shadow:var(--shadow-1)}
.rule .rn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
  font-size:var(--t-sm);font-weight:800;margin-bottom:8px}
.rule h3{font-size:var(--t-md);font-weight:800;line-height:1.35;margin-bottom:6px}
.rule p{font-size:var(--t-base);color:var(--ink)}
.ex{margin-top:10px;padding:10px 12px;background:#F2F7FD;border-radius:var(--r-md);border-left:3px solid var(--p2)}
.ex .fr{font-size:var(--t-base);font-weight:700}
.ex .fr em{font-style:normal;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 3px}
.ex .en{font-size:var(--t-xs);color:var(--muted);margin-top:2px}
.exc{background:var(--no-bg);border-radius:var(--r-lg);padding:var(--s-4);margin:var(--s-3) 0}
.exc .lbl{font-size:var(--t-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--review-text)}
.exc p{font-size:var(--t-base);color:var(--no-ink);margin-top:4px}
.seealso{margin:var(--s-4) 0 var(--s-2)}
.seealso .lbl{font-size:var(--t-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.seealso .chips{display:flex;flex-wrap:wrap;gap:8px}
.seealso a{font-size:var(--t-sm);font-weight:700;color:var(--accent-ink);background:var(--accent-soft);
           padding:7px 12px;border-radius:var(--r-pill)}
.cta{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;font-weight:800;
     font-size:var(--t-md);padding:15px;border-radius:var(--r-lg);margin-top:var(--s-3);
     box-shadow:var(--shadow-1)}
.cta:active{transform:scale(.99)}
.notyet{display:block;width:100%;text-align:center;font-size:var(--t-sm);color:var(--faint);
        padding:13px;margin-top:var(--s-3);border:1px dashed var(--line);border-radius:var(--r-lg)}

/* stub rules (topics without authored content yet) */
.rule.stub{border-style:dashed;background:transparent;box-shadow:none;color:var(--faint)}
.rule.stub h3{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<a class="proto-pill" href="index.html">All 4 directions ↺</a>

<script>
/* The grammar-map taxonomy (src/components/progress/taxonomy.ts),
   1:1 — 121 entries, each at exactly one level; groups follow the
   grid's column order, with the Noun group expanded into its three
   subgroups exactly like the map's bottom sheet. */
const ENTRIES = [{"id": "t0", "lv": "A1", "cat": "T", "sub": "", "name": "Present: être & avoir", "slugs": ["present-etre-avoir"], "blurb": "The two essential present-tense verbs: je suis, tu es… and j'ai, tu as… with simple complements."}, {"id": "t1", "lv": "A1", "cat": "T", "sub": "", "name": "Present: -er verbs", "slugs": ["present-er-verbs"], "blurb": "The regular -er pattern that covers most French verbs: je parle, tu parles, il parle, nous parlons, vous parlez, ils parlent."}, {"id": "t2", "lv": "A1", "cat": "T", "sub": "", "name": "Present: common irregular verbs", "slugs": ["present-irregulars"], "blurb": "The everyday irregulars a learner meets first: aller, faire, venir, prendre, dire, savoir, voir, sortir, comprendre, lire."}, {"id": "t3", "lv": "A1", "cat": "T", "sub": "", "name": "Present: pronominal verbs", "slugs": ["present-pronominal"], "blurb": "Reflexive verbs with the agreeing pronoun: je me lève, tu te lèves, il s'appelle — including the m'/t'/s' elision."}, {"id": "t4", "lv": "A1", "cat": "T", "sub": "", "name": "Être en train de", "slugs": ["etre-en-train-de"], "blurb": "Saying what is happening right now: elle est en train de manger — être en train de + infinitive."}, {"id": "t5", "lv": "A1", "cat": "T", "sub": "", "name": "Futur proche", "slugs": ["futur-proche"], "blurb": "The near future with aller + infinitive: je vais partir demain, nous allons manger."}, {"id": "t6", "lv": "A1", "cat": "T", "sub": "", "name": "Passé récent", "slugs": ["passe-recent"], "blurb": "The recent past with venir de + infinitive: je viens de finir, elle vient de partir."}, {"id": "t7", "lv": "A1", "cat": "T", "sub": "", "name": "Passé composé: first steps", "slugs": ["pc-aux"], "blurb": "Choosing between être and avoir in the passé composé (elle est tombée, not elle a tombée)."}, {"id": "t8", "lv": "A1", "cat": "M", "sub": "", "name": "Imperative", "slugs": ["imperative"], "blurb": "Giving commands: parle !, mangez !, allons-y — tu/nous/vous forms without the subject, and ne … pas around them."}, {"id": "t9", "lv": "A1", "cat": "M", "sub": "", "name": "Polite conditionnel", "slugs": ["polite-conditionnel"], "blurb": "Making requests soft with je voudrais — the polite way to want (je voudrais un café, s'il vous plaît)."}, {"id": "t10", "lv": "A1", "cat": "M", "sub": "", "name": "Pouvoir, vouloir, devoir + infinitive", "slugs": ["modal-verbs-infinitive"], "blurb": "The three essential modals: je peux, je veux, je dois + a second verb that stays in the infinitive."}, {"id": "t11", "lv": "A1", "cat": "M", "sub": "", "name": "Il faut + infinitive", "slugs": ["il-faut-infinitive"], "blurb": "Expressing necessity impersonally: il faut partir, il faut finir — one form, no person."}, {"id": "t12", "lv": "A1", "cat": "M", "sub": "", "name": "Pour + infinitive", "slugs": ["pour-infinitive"], "blurb": "Saying what something is for: je lis pour apprendre — pour + infinitive (never par)."}, {"id": "t13", "lv": "A1", "cat": "N", "sub": "n", "name": "Gender of nouns", "slugs": ["gender-of-nouns"], "blurb": "Every French noun is masculine or feminine, and the article shows it: un problème, une idée."}, {"id": "t14", "lv": "A1", "cat": "N", "sub": "n", "name": "Plural of nouns", "slugs": ["plural-of-nouns"], "blurb": "Making nouns plural: most take -s, but -eau takes -x, -al takes -aux, and -s/-x/-z don't change."}, {"id": "t15", "lv": "A1", "cat": "N", "sub": "n", "name": "Definite & indefinite articles", "slugs": ["definite-indefinite-articles"], "blurb": "un/une/des versus le/la/les (l' before a vowel) — choosing the article that fits the noun and the meaning."}, {"id": "t16", "lv": "A1", "cat": "N", "sub": "n", "name": "Partitive articles", "slugs": ["partitive-articles"], "blurb": "Saying some with food and quantities: du pain, de la confiture, de l'eau — and the negative that turns them into de."}, {"id": "t17", "lv": "A1", "cat": "N", "sub": "a", "name": "Adjective agreement", "slugs": ["adjective-agreement"], "blurb": "Adjectives match their noun's gender and number: un garçon grand, une fille grande, des filles grandes."}, {"id": "t18", "lv": "A1", "cat": "N", "sub": "a", "name": "Adjective position", "slugs": ["adjective-position"], "blurb": "Most adjectives follow the noun (une voiture rouge), but the BAGS crowd — beauty, age, goodness, size — goes before (une grande maison)."}, {"id": "t19", "lv": "A1", "cat": "N", "sub": "a", "name": "Possessive adjectives", "slugs": ["possessive-adjectives"], "blurb": "mon/ma/mes, ton/ta/tes, son/sa/ses… — agreeing with the thing owned, not the owner (son frère, even for Marie)."}, {"id": "t20", "lv": "A1", "cat": "N", "sub": "a", "name": "Demonstrative adjectives", "slugs": ["demonstrative-adjectives"], "blurb": "Pointing at things: ce chien, cet arbre, cette table, ces livres — with the cet-before-a-vowel rule."}, {"id": "t21", "lv": "A1", "cat": "N", "sub": "a", "name": "Quantity & intensity adverbs", "slugs": ["quantity-adverbs"], "blurb": "très + adjective (très content) versus beaucoup de + noun (beaucoup d'amis) — the pairing learners mix up."}, {"id": "t22", "lv": "A1", "cat": "N", "sub": "p", "name": "Subject pronouns & on", "slugs": ["subject-pronouns"], "blurb": "Replacing subjects with je, tu, il, elle, nous, vous, ils, elles — and the informal on that takes a 3rd-person form."}, {"id": "t23", "lv": "A1", "cat": "N", "sub": "p", "name": "Stressed pronouns", "slugs": ["stressed-pronouns"], "blurb": "The strong forms after prepositions and after c'est: avec moi, pour toi, c'est lui, c'est eux."}, {"id": "t24", "lv": "A1", "cat": "S", "sub": "", "name": "Ne… pas, ne… jamais", "slugs": ["negation"], "blurb": "Wrapping the conjugated verb in ne … pas (elle ne parle pas anglais)."}, {"id": "t25", "lv": "A1", "cat": "S", "sub": "", "name": "Three question forms", "slugs": ["three-question-forms"], "blurb": "Asking three ways: intonation (tu vas bien ?), est-ce que (est-ce que tu vas bien ?), and inversion (vas-tu bien ?)."}, {"id": "t26", "lv": "A1", "cat": "S", "sub": "", "name": "Question words", "slugs": ["question-words"], "blurb": "qui, que, où, quand, comment, pourquoi, combien — the words that open questions, in inversion and est-ce que forms."}, {"id": "t27", "lv": "A1", "cat": "S", "sub": "", "name": "Il y a, c'est, voilà", "slugs": ["il-ya-cest-voila"], "blurb": "Presenting and pointing: il y a deux chiens (there are), c'est mon ami, voilà le train — and the il y a / il a trap."}, {"id": "t28", "lv": "A1", "cat": "S", "sub": "", "name": "C'est vs il/elle est", "slugs": ["cest-vs-il-est"], "blurb": "Choosing between c'est + noun and il/elle est + adjective (c'est une bonne idée, c'est évident)."}, {"id": "t29", "lv": "A1", "cat": "S", "sub": "", "name": "Dans, depuis, il y a", "slugs": ["dans-depuis-il-ya"], "blurb": "Three time expressions learners swap wrongly: dans (in, future), depuis (since/for, ongoing), il y a (ago, past)."}, {"id": "t30", "lv": "A1", "cat": "S", "sub": "", "name": "Prepositions of place", "slugs": ["prepositions-place"], "blurb": "Where things and people are: à Paris, en France, au Japon, chez Marie, dans le sac, sur la table."}, {"id": "t31", "lv": "A1", "cat": "S", "sub": "", "name": "Prepositions of time", "slugs": ["prepositions-time"], "blurb": "When things happen: avant le dîner, après le cours, pendant les vacances, sous la pluie."}, {"id": "t32", "lv": "A1", "cat": "S", "sub": "", "name": "Et, ou, mais, alors", "slugs": ["connectors-basic"], "blurb": "The four connectors that shape a sentence: and, or, but, so — chosen by the relation between the clauses."}, {"id": "t33", "lv": "A2", "cat": "T", "sub": "", "name": "Passé composé with avoir", "slugs": ["pc-avoir"], "blurb": "Forming the passé composé with avoir and the past participle (nous avons mangé)."}, {"id": "t34", "lv": "A2", "cat": "T", "sub": "", "name": "Passé composé with être", "slugs": ["pc-etre"], "blurb": "Forming the passé composé with être and making the participle agree with the subject (elle est allée, ils sont partis)."}, {"id": "t35", "lv": "A2", "cat": "T", "sub": "", "name": "Imparfait", "slugs": ["imparfait"], "blurb": "Forming the imparfait of common verbs (je parlais, nous étions, elles venaient)."}, {"id": "t36", "lv": "A2", "cat": "T", "sub": "", "name": "Passé composé vs imparfait", "slugs": ["imparfait-vs-pc"], "blurb": "Choosing the imparfait for background and habits versus the passé composé for events (pendant que je dormais… le téléphone a sonné)."}, {"id": "t37", "lv": "A2", "cat": "T", "sub": "", "name": "Futur simple", "slugs": ["futur-simple"], "blurb": "Talking about tomorrow and later: endings -ai, -as, -a, -ons, -ez, -ont on the stem, irregulars included (je serai, j'irai, je ferai)."}, {"id": "t38", "lv": "A2", "cat": "M", "sub": "", "name": "Verbs with prepositions", "slugs": ["verbs-prepositions"], "blurb": "Which preposition joins the conjugated verb to its infinitive: aider à, apprendre à, réussir à, versus décider de, essayer de, oublier de."}, {"id": "t39", "lv": "A2", "cat": "N", "sub": "a", "name": "Comparative", "slugs": ["comparative"], "blurb": "Comparing with plus/moins/aussi … que (le TGV est plus rapide que le vélo) — plus for more, moins for less, aussi for equal."}, {"id": "t40", "lv": "A2", "cat": "N", "sub": "a", "name": "Superlative", "slugs": ["superlative"], "blurb": "The extreme form: le/la/les plus + adjective agreeing with the noun (la plus belle), and bon → meilleur, mauvais → pire."}, {"id": "t41", "lv": "A2", "cat": "N", "sub": "p", "name": "Direct object pronouns", "slugs": ["pronouns-cod-coi"], "blurb": "Replacing direct and indirect objects with le, la, les, lui, leur and placing them before the verb (Je la connais, Tu lui téléphones)."}, {"id": "t42", "lv": "A2", "cat": "N", "sub": "p", "name": "Indirect object pronouns", "slugs": ["pronouns-cod-coi"], "blurb": "Replacing direct and indirect objects with le, la, les, lui, leur and placing them before the verb (Je la connais, Tu lui téléphones)."}, {"id": "t43", "lv": "A2", "cat": "N", "sub": "p", "name": "En", "slugs": ["pronoun-en"], "blurb": "Replacing de + thing with en before the verb (j'en parle, tu en manges) — and the j'en elision trap."}, {"id": "t44", "lv": "A2", "cat": "N", "sub": "p", "name": "Y", "slugs": ["pronoun-y"], "blurb": "Replacing à + place with y and placing it before the verb (elle va à Paris → elle y va)."}, {"id": "t45", "lv": "A2", "cat": "N", "sub": "p", "name": "Uses of on", "slugs": ["uses-of-on"], "blurb": "Beyond on = nous: on for people in general (ici on parle français) — always with the 3rd-person singular form."}, {"id": "t46", "lv": "A2", "cat": "N", "sub": "p", "name": "Qui, que, où", "slugs": ["qui-que-ou"], "blurb": "Joining clauses with relative pronouns: qui for the subject, que for the object, où for place and time (la ville où j'habite)."}, {"id": "t47", "lv": "A2", "cat": "N", "sub": "p", "name": "Possessive pronouns", "slugs": ["possessive-pronouns"], "blurb": "The standing-alone possessives: le mien, la mienne, les nôtres — gender and number come from the thing, not the owner."}, {"id": "t48", "lv": "A2", "cat": "N", "sub": "p", "name": "Tout, toute, tous", "slugs": ["tout-toute-tous"], "blurb": "The four faces of tout: tout le temps, toute la journée, tous les amis, toutes les fenêtres — agreeing with what follows."}, {"id": "t49", "lv": "A2", "cat": "N", "sub": "p", "name": "Ça, cela, ceci", "slugs": ["ca-cela-ceci"], "blurb": "Pointing without a noun: ceci (this, near), cela/ça (that, general) — and when everyday ça replaces both."}, {"id": "t50", "lv": "A2", "cat": "S", "sub": "", "name": "Ne… plus, rien, personne", "slugs": ["ne-plus-rien-personne"], "blurb": "Negation beyond ne … pas: ne … plus (not anymore), ne … rien (nothing), ne … personne (nobody) — same wrapping, stronger meanings."}, {"id": "t51", "lv": "A2", "cat": "S", "sub": "", "name": "Exclamations", "slugs": ["exclamations"], "blurb": "Exclaiming: quel agreeing with its noun (quelle belle vue !) and que/comme as intensifiers (qu'il fait chaud !)."}, {"id": "t52", "lv": "A2", "cat": "S", "sub": "", "name": "Cause & consequence", "slugs": ["cause-consequence"], "blurb": "Linking cause and result: parce que before the cause (parce qu'il pleut), donc before the result, à cause de + noun for blame."}, {"id": "t53", "lv": "A2", "cat": "S", "sub": "", "name": "Purpose & opposition", "slugs": ["purpose-opposition"], "blurb": "pour + infinitive for purpose (j'étudie pour réussir), and despite it all: malgré + noun, même si + clause."}, {"id": "t54", "lv": "A2", "cat": "S", "sub": "", "name": "Sequencing connectors", "slugs": ["sequencing-connectors"], "blurb": "Ordering a story: d'abord, ensuite, puis, enfin — first, then, finally."}, {"id": "t55", "lv": "B1", "cat": "T", "sub": "", "name": "Plus-que-parfait", "slugs": ["plus-que-parfait"], "blurb": "The earlier of two past events: imparfait of the auxiliary + past participle — quand je suis arrivé, il avait déjà mangé."}, {"id": "t56", "lv": "B1", "cat": "T", "sub": "", "name": "Past tenses in a story", "slugs": ["past-tenses-story"], "blurb": "Choosing between imparfait (background), passé composé (events) and plus-que-parfait (anteriority) inside a short narrative."}, {"id": "t57", "lv": "B1", "cat": "T", "sub": "", "name": "Agreement with preceding object", "slugs": ["accord-antepose"], "blurb": "Making the participle agree when the direct object precedes the verb (les fleurs que j'ai achetées)."}, {"id": "t58", "lv": "B1", "cat": "M", "sub": "", "name": "Conditionnel présent: forms", "slugs": ["conditionnel-forms"], "blurb": "Futur stem + imparfait endings: il a promis qu'il viendrait — the future seen from the past."}, {"id": "t59", "lv": "B1", "cat": "M", "sub": "", "name": "Conditionnel présent: uses", "slugs": ["conditionnel-uses"], "blurb": "Softening with the conditionnel: pourriez-vous (requests), je voudrais (wishes), tu devrais (advice)."}, {"id": "t60", "lv": "B1", "cat": "M", "sub": "", "name": "Subjonctif présent: forms", "slugs": ["subjonctif-forms"], "blurb": "The irregular subjonctif stems: que je sois, que j'aie, que j'aille, que je fasse, que je puisse."}, {"id": "t61", "lv": "B1", "cat": "M", "sub": "", "name": "Subjonctif after feelings & il faut", "slugs": ["subjonctif"], "blurb": "Using the subjonctif after expressions of feeling, doubt and necessity (je doute qu'il ait raison, je suis content que tu viennes)."}, {"id": "t62", "lv": "B1", "cat": "M", "sub": "", "name": "Subjonctif vs indicatif", "slugs": ["subjonctif-vs-indicatif"], "blurb": "Je veux qu'il vienne but je pense qu'il vient — wish and possibility take the subjonctif, belief and certainty keep the indicatif."}, {"id": "t63", "lv": "B1", "cat": "M", "sub": "", "name": "Passive voice", "slugs": ["passive-voice"], "blurb": "être + past participle agreeing with the subject: la lettre a été envoyée — and the « on » shortcut to an agentless passive."}, {"id": "t64", "lv": "B1", "cat": "M", "sub": "", "name": "Gérondif", "slugs": ["gerondif"], "blurb": "en + participe présent for simultaneity and means: il maigrit en mangeant moins — with its spelling traps (mangeant, commençant, appelant)."}, {"id": "t65", "lv": "B1", "cat": "N", "sub": "n", "name": "Nominalization", "slugs": ["nominalization"], "blurb": "Turning verbs into nouns: décider → la décision, réussir → la réussite — with the gender you must learn alongside."}, {"id": "t66", "lv": "B1", "cat": "N", "sub": "p", "name": "Double object pronouns", "slugs": ["double-pronouns"], "blurb": "Two pronouns before the verb in a fixed order: je le lui donne — le/la/les first, lui/leur second."}, {"id": "t67", "lv": "B1", "cat": "N", "sub": "p", "name": "Dont", "slugs": ["dont"], "blurb": "The relative for verb + de: le film dont je parle, le projet dont on est fier — and the possessive dont l'histoire."}, {"id": "t68", "lv": "B1", "cat": "N", "sub": "p", "name": "Compound relatives", "slugs": ["compound-relatives"], "blurb": "Preposition + lequel agreeing with its antecedent: la ville dans laquelle j'habite, les amis avec lesquels je sors."}, {"id": "t69", "lv": "B1", "cat": "N", "sub": "p", "name": "Indefinite pronouns", "slugs": ["indefinite-pronouns"], "blurb": "quelqu'un, quelque chose, chacun, tous — including quelqu'un de gentil, where the adjective stays masculine."}, {"id": "t70", "lv": "B1", "cat": "N", "sub": "p", "name": "Ce qui, ce que, ce dont", "slugs": ["ce-qui-ce-que-ce-dont"], "blurb": "Relative pronouns without an antecedent noun: ce qui m'étonne, ce que je veux, ce dont j'ai besoin."}, {"id": "t71", "lv": "B1", "cat": "S", "sub": "", "name": "Si + présent", "slugs": ["si-present"], "blurb": "Real possibility: si tu viens, on ira — présent after si, futur in the result, never si + futur."}, {"id": "t72", "lv": "B1", "cat": "S", "sub": "", "name": "Si + imparfait", "slugs": ["si-imparfait"], "blurb": "The unreal present: si j'avais le temps, je viendrais — imparfait after si, conditionnel in the result."}, {"id": "t73", "lv": "B1", "cat": "S", "sub": "", "name": "Reported speech (present)", "slugs": ["reported-speech"], "blurb": "Reporting with present tenses: il dit que…, il demande si… — statements with que, yes/no questions with si."}, {"id": "t74", "lv": "B1", "cat": "S", "sub": "", "name": "Ne… que, aucun, ni… ni", "slugs": ["restriction-ne-que"], "blurb": "Restrictive negation: je ne mange que des légumes (only), aucun doute (not a single), ni café ni thé (neither)."}, {"id": "t75", "lv": "B1", "cat": "S", "sub": "", "name": "Cause & consequence (extended)", "slugs": ["cause-consequence-extended"], "blurb": "Beyond parce que: grâce à vs à cause de, c'est pourquoi, si bien que, à force de."}, {"id": "t76", "lv": "B1", "cat": "S", "sub": "", "name": "Pour que, afin de", "slugs": ["pour-que-afin-de"], "blurb": "Purpose with a subject change: je répète pour que tu comprennes — same subject keeps pour + infinitive."}, {"id": "t77", "lv": "B1", "cat": "S", "sub": "", "name": "Concession & opposition", "slugs": ["concession-opposition"], "blurb": "Despite it all: bien que + subjonctif (bien qu'il soit malade), malgré + noun, même si + indicatif."}, {"id": "t78", "lv": "B1", "cat": "S", "sub": "", "name": "Ce qui…, c'est", "slugs": ["ce-qui-cest"], "blurb": "Emphasis with a cleft: ce qui m'étonne, c'est son courage — the written comma before c'est."}, {"id": "t79", "lv": "B1", "cat": "S", "sub": "", "name": "Il est / c'est + adjective + de", "slugs": ["il-est-cest-adjectif-de"], "blurb": "Impersonal judgement: il est facile d'apprendre le français — with the d' elision and the spoken c'est."}, {"id": "t80", "lv": "B1", "cat": "S", "sub": "", "name": "Narrative time markers", "slugs": ["narrative-time-markers"], "blurb": "Setting the rhythm of a story: soudain, pendant que, alors que, enfin, au moment où."}, {"id": "t81", "lv": "B2", "cat": "T", "sub": "", "name": "Futur antérieur", "slugs": ["futur-anterieur"], "blurb": "The earlier future: quand tu seras arrivé, nous serons prêts — futur of the auxiliary + past participle."}, {"id": "t82", "lv": "B2", "cat": "T", "sub": "", "name": "Past infinitive", "slugs": ["past-infinitive"], "blurb": "Anteriority in one clause: après avoir fini, après être arrivé — the same auxiliary as the passé composé."}, {"id": "t83", "lv": "B2", "cat": "T", "sub": "", "name": "Sequence of tenses", "slugs": ["sequence-of-tenses"], "blurb": "A past main clause pulls the subordinate back: il a dit qu'il viendrait — present keeps the futur."}, {"id": "t84", "lv": "B2", "cat": "T", "sub": "", "name": "Exceptional participle agreement", "slugs": ["exceptional-participle"], "blurb": "With avoir, the participle agrees with a preceding direct object: les fleurs que j'ai cueillies."}, {"id": "t85", "lv": "B2", "cat": "M", "sub": "", "name": "Conditionnel passé", "slugs": ["conditionnel-passe"], "blurb": "The unreal past result: si tu m'avais écouté, j'aurais fini — avoir/être in the conditionnel + participle."}, {"id": "t86", "lv": "B2", "cat": "M", "sub": "", "name": "Subjonctif after verbs & impersonals", "slugs": ["subjonctif-verbs-impersonals"], "blurb": "Beyond il faut: craindre que, redouter que, attendre que take the subjonctif; être sûr que, admettre que keep the indicatif."}, {"id": "t87", "lv": "B2", "cat": "M", "sub": "", "name": "Subjonctif after conjunctions", "slugs": ["subjonctif-conjunctions"], "blurb": "The conjunction series: bien que, avant que, jusqu'à ce que, sans que, pourvu que — all subjonctif."}, {"id": "t88", "lv": "B2", "cat": "M", "sub": "", "name": "Subjonctif passé", "slugs": ["subjonctif-passe"], "blurb": "A completed action inside the subjonctif: je suis content qu'il ait fini, qu'elle soit partie."}, {"id": "t89", "lv": "B2", "cat": "M", "sub": "", "name": "Participle vs verbal adjective", "slugs": ["participe-ou-adjectif"], "blurb": "un film amusant (it amuses) vs des enfants amusés (they are amused); fatigant/fatigué and its traps."}, {"id": "t90", "lv": "B2", "cat": "N", "sub": "p", "name": "Interrogative lequel", "slugs": ["lequel-interrogatif"], "blurb": "Asking with lequel: laquelle de ces robes — the question word agrees with the thing asked about."}, {"id": "t91", "lv": "B2", "cat": "S", "sub": "", "name": "Si + plus-que-parfait", "slugs": ["si-plus-que-parfait"], "blurb": "The unreal past: si j'avais su, je serais venu — plus-que-parfait after si, conditionnel passé in the result."}, {"id": "t92", "lv": "B2", "cat": "S", "sub": "", "name": "Au cas où, à condition que", "slugs": ["au-cas-ou-condition"], "blurb": "Contingency vs requirement: au cas où il pleuvrait (conditionnel), à condition que tu sois prêt (subjonctif)."}, {"id": "t93", "lv": "B2", "cat": "S", "sub": "", "name": "Advanced opposition & concession", "slugs": ["opposition-avancee"], "blurb": "Formal opposition: néanmoins, toutefois, en revanche — and the extreme concessions quoique, quand bien même."}, {"id": "t94", "lv": "B2", "cat": "S", "sub": "", "name": "Advanced purpose & cause", "slugs": ["but-cause-avancee"], "blurb": "Formal purpose and cause: de peur que, de sorte que, afin de, vu que, étant donné que."}, {"id": "t95", "lv": "C1", "cat": "T", "sub": "", "name": "Passé simple (recognize)", "slugs": ["passe-simple-recognize"], "blurb": "The tense of written narrative: il ouvrit la porte — spot the completed literary event, never confused with the imparfait again."}, {"id": "t96", "lv": "C1", "cat": "T", "sub": "", "name": "Passé antérieur (recognize)", "slugs": ["passe-anterieur"], "blurb": "Literary anteriority: quand il eut fini, on partit — passé simple of the auxiliary + participle, mostly after quand and à peine."}, {"id": "t97", "lv": "C1", "cat": "T", "sub": "", "name": "Agreement of pronominal verbs", "slugs": ["pronominal-agreement"], "blurb": "Elle s'est levée but elle s'est lavé les mains — whether se is direct or indirect decides the participle."}, {"id": "t98", "lv": "C1", "cat": "M", "sub": "", "name": "Subtle subjonctif cases", "slugs": ["subjonctif-subtle"], "blurb": "avant que + subjonctif but après que + indicatif; de peur que, sans que, loin que, autant que je sache."}, {"id": "t99", "lv": "C1", "cat": "M", "sub": "", "name": "Subjonctif vs indicatif meaning", "slugs": ["subjonctif-meaning"], "blurb": "un assistant qui ait (any will do) vs l'assistant qui a (the one who does) — the mood itself carries the meaning."}, {"id": "t100", "lv": "C1", "cat": "M", "sub": "", "name": "Attenuating conditionnel", "slugs": ["conditionnel-attenuation"], "blurb": "The hedging tense of journalists and polite people: il semblerait que, la décision aurait des conséquences, vous devriez…"}, {"id": "t101", "lv": "C1", "cat": "M", "sub": "", "name": "Infinitive clauses", "slugs": ["infinitive-clauses"], "blurb": "faire réparer sa voiture, écouter les enfants chanter — perception and causative verbs with a controlled infinitive."}, {"id": "t102", "lv": "C1", "cat": "M", "sub": "", "name": "Literary hypotheticals", "slugs": ["literary-hypotheticals"], "blurb": "Qui l'eût cru ? — the literary conditionnel passé (eût fait = aurait fait) behind Maupassant's conditional world."}, {"id": "t103", "lv": "C1", "cat": "N", "sub": "a", "name": "Quelque, quel que", "slugs": ["quelque-quel-que"], "blurb": "One space or one letter decides: quelque paresseux qu'il soit, quel que soit le prix, quoi qu'il dise."}, {"id": "t104", "lv": "C1", "cat": "N", "sub": "p", "name": "Auquel, duquel & co.", "slugs": ["auquel-duquel"], "blurb": "Compound relatives with à and de: le projet auquel je pense, le voisin duquel je connais la fille."}, {"id": "t105", "lv": "C1", "cat": "N", "sub": "p", "name": "Ellipsis & avoiding repetition", "slugs": ["ellipsis-repetition"], "blurb": "celle de son frère, je les ai déjà pris — replacing nouns with celui/celle/le/la/les so prose stops repeating itself."}, {"id": "t106", "lv": "C1", "cat": "S", "sub": "", "name": "Avoir beau, quand bien même", "slugs": ["avoir-beau"], "blurb": "In-vain concession: il a beau pleuvoir, le pique-nique est maintenu — and the extreme quand bien même il pleuvrait."}, {"id": "t107", "lv": "C1", "cat": "S", "sub": "", "name": "Formal connectors", "slugs": ["formal-connectors"], "blurb": "The written connective tissue: en effet, par conséquent, en outre, pourtant, quant à, or (not hors!)."}, {"id": "t108", "lv": "C1", "cat": "S", "sub": "", "name": "Formal inversion", "slugs": ["formal-inversion"], "blurb": "Peut-être viendra-t-il, rare sont les occasions — the stylistic inversion after fronted words, hyphen and all."}, {"id": "t109", "lv": "C1", "cat": "S", "sub": "", "name": "Expletive ne", "slugs": ["expletive-ne"], "blurb": "The ne that negates nothing: je crains qu'il ne vienne, plus qu'on ne le croit — pure literary polish."}, {"id": "t110", "lv": "C1", "cat": "S", "sub": "", "name": "Impersonal formal style", "slugs": ["impersonal-formal"], "blurb": "il convient de, il s'agit de, il importe que, il ne tient qu'à vous de — the impersonal machinery of formal French."}, {"id": "t111", "lv": "C1", "cat": "S", "sub": "", "name": "Spoken vs written French", "slugs": ["spoken-vs-written"], "blurb": "ça vs cela, on vs nous, y a vs il existe — the same thought, dressed for the chat or for the essay."}, {"id": "t112", "lv": "C2", "cat": "T", "sub": "", "name": "Passé simple, all persons", "slugs": ["passe-simple-all-persons"], "blurb": "The full literary conjugation: je vins, tu fis, il courut, nous fûmes, vous vîtes, ils lurent."}, {"id": "t113", "lv": "C2", "cat": "T", "sub": "", "name": "Fine participle agreement", "slugs": ["fine-participle-agreement"], "blurb": "les fleurs que je lui ai données but elle s'est rendu compte — the preceding-object rule with all its edge cases."}, {"id": "t114", "lv": "C2", "cat": "M", "sub": "", "name": "Subjonctif imparfait", "slugs": ["subjonctif-imparfait"], "blurb": "The literary past subjonctif: la reine souhaitait qu'il vînt, qui qu'il fût — recognise it, decode it, admire it."}, {"id": "t115", "lv": "C2", "cat": "M", "sub": "", "name": "Conditionnel passé 2e forme", "slugs": ["conditionnel-passe-deuxieme"], "blurb": "S'il avait su, il eût refusé — the literary second form of the past conditional behind qui l'eût cru."}, {"id": "t116", "lv": "C2", "cat": "N", "sub": "a", "name": "Adjective position & meaning", "slugs": ["adjective-position-meaning"], "blurb": "un grand homme vs un homme grand, mon ancien professeur vs des meubles anciens — position rewrites the meaning."}, {"id": "t117", "lv": "C2", "cat": "S", "sub": "", "name": "Literary negations", "slugs": ["literary-negations"], "blurb": "nul ne sait, point n'est besoin, elle ne parlait guère — the written negation family beyond ne… pas."}, {"id": "t118", "lv": "C2", "cat": "S", "sub": "", "name": "Stylistic word order", "slugs": ["stylistic-word-order"], "blurb": "Grande fut sa surprise, franchi le seuil, et voici que la pluie cessa — fronted attributes and participles in prose."}, {"id": "t119", "lv": "C2", "cat": "S", "sub": "", "name": "Archaic fixed phrases", "slugs": ["archaic-phrases"], "blurb": "il y a belle lurette, de par la loi, chose promise chose due, le cas échéant — formulas that time forgot."}, {"id": "t120", "lv": "C2", "cat": "S", "sub": "", "name": "Register shifts", "slugs": ["register-shifts"], "blurb": "Rewrite on a eu des soucis into nous avons rencontré des difficultés — moving a sentence across registers."}];
const RULES   = {"t0": {"rules": [{"h": "Two irregular workhorses", "p": "Être and avoir follow no pattern; learn their six forms by heart. They build most of the rest of the language.", "ex": {"fr": "Tu <em>es<\/em> fatigué ? Oui, j'<em>ai<\/em> sommeil.", "en": "Are you tired? Yes, I'm sleepy."}}, {"h": "je becomes j'", "p": "Before a vowel, je drops its e: je suis → j'ai, j'étais, j'aurai.", "ex": {"fr": "J'<em>ai<\/em> une question.", "en": "I have a question."}}]}, "t1": {"rules": [{"h": "Drop -er, add the endings", "p": "parler → je parle, tu parles, il parle, nous parlons, vous parlez, ils parlent. About 90% of verbs work this way.", "ex": {"fr": "Nous <em>parlons<\/em> français à la maison.", "en": "We speak French at home."}}, {"h": "The -ent you never hear", "p": "il parle and ils parlent sound identical. The endings are spelling, not sound; listen for nous and vous instead.", "ex": {"fr": "Ils <em>habitent<\/em> à Lyon.", "en": "They live in Lyon."}}]}, "t2": {"rules": [{"h": "Learn the top ten as words", "p": "aller, faire, prendre, venir, pouvoir, vouloir, devoir, savoir, voir, dire are irregular and everywhere. Memorize each as a whole word, not a pattern.", "ex": {"fr": "Je <em>vais<\/em> au marché et je <em>prends<\/em> du pain.", "en": "I'm going to the market and getting bread."}}, {"h": "The boot shape", "p": "In many irregulars, nous and vous revert to the infinitive stem: je viens, tu viens, il vient, but nous venons, vous venez.", "ex": {"fr": "Ils <em>viennent<\/em> ce soir ; nous, nous <em>venons<\/em> demain.", "en": "They're coming tonight; we're coming tomorrow."}}]}, "t3": {"rules": [{"h": "The pronoun copies the subject", "p": "se lever → je me lève, tu te lèves, il se lève, nous nous levons, vous vous levez, ils se lèvent.", "ex": {"fr": "Je <em>me<\/em> lève à sept heures.", "en": "I get up at seven."}}, {"h": "Daily routine is pronominal", "p": "Many verbs take the pronoun even though English doesn't: s'appeler, se lever, se coucher, se rappeler.", "ex": {"fr": "Elle <em>s'<\/em>appelle Léa.", "en": "Her name is Léa."}}, {"h": "Reciprocal and passive se", "p": "With a plural subject the same form reads 'each other': nous nous aimons, ils s'écrivent. With a thing as subject it reads passive: ce livre se vend bien.", "ex": {"fr": "Nous <em>nous<\/em> aimons ; ce livre <em>se vend<\/em> bien.", "en": "We love each other; this book sells well."}}], "exc": "Some verbs exist only with se: se souvenir, s'en aller, il se peut que = maybe."}, "t4": {"rules": [{"h": "Happening right now", "p": "être en train de + infinitive points at this exact moment. The plain present covers both now and habitually; this pins it to now.", "ex": {"fr": "Je <em>suis en train de<\/em> cuisiner, je te rappelle.", "en": "I'm cooking right now, I'll call you back."}}]}, "t5": {"rules": [{"h": "aller + infinitive", "p": "The near future works like English 'going to'. aller conjugates, the main verb stays an infinitive.", "ex": {"fr": "On <em>va voir<\/em> un film ce soir.", "en": "We're going to watch a film tonight."}}, {"h": "Decided vs predicted", "p": "Futur proche sounds decided or imminent; futur simple sounds predicted or distant. Tonight's plans take futur proche.", "ex": {"fr": "Il <em>va pleuvoir<\/em>, prends ton parapluie.", "en": "It's going to rain, take your umbrella."}}, {"h": "The past near future", "p": "Aller in the imparfait + infinitive = was about to. The plan was set, then something interrupted it.", "ex": {"fr": "Il <em>allait<\/em> partir quand elle est arrivée.", "en": "He was about to leave when she arrived."}}]}, "t6": {"rules": [{"h": "venir de + infinitive", "p": "'Just did it'. venir conjugates, de stays, the action stays an infinitive.", "ex": {"fr": "Je <em>viens de<\/em> finir mes devoirs.", "en": "I've just finished my homework."}}, {"h": "The past of just", "p": "For 'had just', venir moves to the imparfait: je venais de finir. Never the passé composé of venir for this meaning.", "ex": {"fr": "Il <em>venait de<\/em> partir quand elle est arrivée.", "en": "He had just left when she arrived."}}]}, "t7": {"rules": [{"h": "Two pieces", "p": "Passé composé = avoir or être in the present + the participle. Regular participles: parler → parlé, finir → fini, vendre → vendu.", "ex": {"fr": "J'<em>ai mangé<\/em> et elle <em>est partie<\/em>.", "en": "I ate and she left."}}, {"h": "A finished event", "p": "It says what happened and moved on: what you did, not how things were.", "ex": {"fr": "Hier, nous <em>avons visité<\/em> le musée.", "en": "Yesterday we visited the museum."}}]}, "t8": {"rules": [{"h": "Present tense, no subject", "p": "Take the tu, nous or vous present form and drop the pronoun: parle ! parlons ! parlez !", "ex": {"fr": "<em>Écoute<\/em> bien et <em>répète<\/em>.", "en": "Listen carefully and repeat."}}, {"h": "Three rebels", "p": "être → sois, soyons, soyez. avoir → aie, ayons, ayez. savoir → sache, sachons, sachez.", "ex": {"fr": "<em>Sois<\/em> gentil avec le chat !", "en": "Be nice to the cat!"}}, {"h": "The tu -s drops, then returns", "p": "-er verbs and aller drop the tu -s: parle ! va ! But it comes back before y and en: vas-y, parles-en.", "ex": {"fr": "N'hésite pas, <em>vas-y<\/em> !", "en": "Don't hesitate, go on!"}}, {"h": "Reflexive commands", "p": "Attach the reflexive pronoun after the verb: lève-toi, levons-nous, levez-vous. The negative wraps normally: ne te lève pas.", "ex": {"fr": "<em>Lève-toi<\/em> !", "en": "Get up!"}}, {"h": "Past imperative: aie fini, sois parti", "p": "avoir or être imperative + participle orders an action done by a deadline. Formal register only — speech uses the present imperative plus a deadline.", "ex": {"fr": "Soyez <em>rentrés<\/em> avant minuit.", "en": "Be back before midnight."}}]}, "t9": {"rules": [{"h": "je voudrais, not je veux", "p": "The conditionnel of vouloir, pouvoir and aimer turns requests into polite ones.", "ex": {"fr": "Je <em>voudrais<\/em> un café, s'il vous plaît.", "en": "I'd like a coffee, please."}}, {"h": "Pourriez-vous", "p": "pouvoir in the conditionnel makes questions softer than pouvez-vous.", "ex": {"fr": "<em>Pourriez-vous<\/em> m'aider, s'il vous plaît ?", "en": "Could you help me, please?"}}]}, "t10": {"rules": [{"h": "Can, want, must", "p": "pouvoir = can, vouloir = want, devoir = must. Each sits straight before an infinitive.", "ex": {"fr": "Je <em>veux apprendre<\/em>, mais je <em>dois travailler<\/em>.", "en": "I want to learn, but I have to work."}}, {"h": "High-frequency irregulars", "p": "je peux, je veux, je dois; ils peuvent, ils veulent, ils doivent. You will use these more than most regular verbs.", "ex": {"fr": "Ils <em>peuvent venir<\/em> à huit heures.", "en": "They can come at eight."}}]}, "t11": {"rules": [{"h": "The impersonal must", "p": "il faut + infinitive = it's necessary to. The il never changes and nothing agrees with anything.", "ex": {"fr": "<em>Il faut<\/em> réserver à l'avance.", "en": "You have to book ahead."}}, {"h": "il me faut + noun", "p": "With a person and a noun, il faut becomes 'need': il me faut du temps.", "ex": {"fr": "<em>Il me faut<\/em> cinq minutes.", "en": "I need five minutes."}}]}, "t12": {"rules": [{"h": "Answers 'what for?'", "p": "pour + infinitive = in order to. It explains a purpose.", "ex": {"fr": "Je suis là <em>pour apprendre<\/em>.", "en": "I'm here to learn."}}, {"h": "Before a noun it's plain 'for'", "p": "pour + noun gives a beneficiary; pour + infinitive gives a goal.", "ex": {"fr": "Un cadeau <em>pour<\/em> Marie.", "en": "A gift for Marie."}}]}, "t13": {"rules": [{"h": "Guess by ending, then memorize", "p": "-tion, -té, -ure, -ette lean feminine; -age, -ment, -eau, -isme lean masculine. The rest is memory.", "ex": {"fr": "la na<em>tion<\/em>, le from<em>age<\/em>.", "en": "the nation, the cheese."}}, {"h": "Learn the article as part of the word", "p": "Memorize 'une table', never 'table'. You can't use the noun without its gender anyway.", "ex": {"fr": "C'est <em>une<\/em> idée, c'est <em>un<\/em> problème.", "en": "It's an idea, it's a problem."}}], "exc": "-age is masculine except la page, la plage, la cage, l'image, la nage, la rage."}, "t14": {"rules": [{"h": "Add -s and don't say it", "p": "Most plurals add a silent -s; singular and plural sound the same. -al goes to -aux: journal → journaux.", "ex": {"fr": "un cheval, des <em>chevaux<\/em>.", "en": "a horse, horses."}}, {"h": "The seven -oux words", "p": "bijou, caillou, chou, genou, hibou, joujou, pou take -x. Every other -ou word takes -s.", "ex": {"fr": "des <em>cailloux<\/em> et des <em>choux<\/em>.", "en": "pebbles and cabbages."}}]}, "t15": {"rules": [{"h": "Known vs new", "p": "le, la, les point at something known; un, une, des introduce something new.", "ex": {"fr": "J'ai <em>un<\/em> chien. <em>Le<\/em> chien s'appelle Rex.", "en": "I have a dog. The dog is called Rex."}}, {"h": "Melting articles", "p": "le and la become l' before a vowel, but les never elides. de + le = du, à + le = au, à + les = aux, de + les = des.", "ex": {"fr": "C'est l'ami <em>du<\/em> voisin, le chien <em>des<\/em> voisins.", "en": "That's the neighbour's friend, the neighbours' dog."}}, {"h": "General statements keep the article", "p": "Abstract and mass nouns take le/la where English uses nothing: le bonheur, le lait, la musique.", "ex": {"fr": "<em>La<\/em> musique est importante.", "en": "Music is important."}}]}, "t16": {"rules": [{"h": "du, de la, des = some", "p": "For stuff you don't count: du pain, de la confiture, des pâtes. Before a vowel it's de l': de l'eau. English often skips the article; French never does.", "ex": {"fr": "Je prends <em>du<\/em> café, elle boit <em>de l'<\/em>eau.", "en": "I have coffee, she drinks water."}}, {"h": "Negative drains it to de", "p": "In the negative, du, de la and des all collapse to de.", "ex": {"fr": "Il n'y a plus <em>de<\/em> lait.", "en": "There's no milk left."}}, {"h": "Liking keeps its article", "p": "aimer, préférer and adorer keep the definite article, even in the negative: je n'aime pas le café.", "ex": {"fr": "Je n'aime pas <em>le<\/em> café noir.", "en": "I don't like black coffee."}}], "exc": "Quantity words also take de: beaucoup de pain, une tasse de café.", "see": ["t24"]}, "t17": {"rules": [{"h": "Copy the noun", "p": "Feminine adds -e, plural adds -s: un petit garçon, une petite fille, des petites filles.", "ex": {"fr": "Elle est <em>contente<\/em>, ils sont <em>contents<\/em>.", "en": "She's happy, they're happy."}}, {"h": "Mixed groups read masculine", "p": "One male in a group and the whole group goes masculine plural.", "ex": {"fr": "Marc et Léa sont <em>petits<\/em>.", "en": "Marc and Léa are short."}}, {"h": "Irregular feminines", "p": "bon → bonne, nouveau → nouvelle, vieux → vieille, beau → belle, blanc → blanche, frais → fraîche. A masculine already ending in -e doesn't move: rouge stays rouge.", "ex": {"fr": "une <em>belle<\/em> journée, une table <em>rouge<\/em>.", "en": "a beautiful day, a red table."}}], "exc": "Noun and compound colours never agree: des robes marron, orange, bleu marine — but rose agrees: des robes roses. beau, nouveau, vieux take bel, nouvel, vieil before a vowel: un bel homme, un vieil ami."}, "t18": {"rules": [{"h": "Most follow, a short band leads", "p": "Most adjectives follow the noun. Beauty, age, goodness and size go before: beau, joli, jeune, vieux, nouveau, bon, mauvais, meilleur, grand, petit, gros, long.", "ex": {"fr": "une <em>grande<\/em> maison, une voiture <em>rouge<\/em>.", "en": "a big house, a red car."}}, {"h": "Position can flip meaning", "p": "un grand homme = a great man; un homme grand = a tall man. ancien, cher and propre behave the same way.", "ex": {"fr": "mon <em>ancien<\/em> prof (ex-) / un meuble <em>ancien<\/em> (antique)", "en": "my former teacher / an antique piece of furniture."}}, {"h": "dernier and seul flip too", "p": "la semaine dernière = last week, la dernière semaine = the final one of a series. seul before the noun = only, after it = alone. Two trailing adjectives join with et; des shrinks to de before a pre-placed adjective (de grandes maisons).", "ex": {"fr": "la <em>semaine dernière<\/em> / la <em>dernière<\/em> semaine ; une robe <em>verte et<\/em> bleue.", "en": "last week / the final week; a green and blue dress."}}]}, "t19": {"rules": [{"h": "Match the thing, not the owner", "p": "mon, ma, mes agree with the noun that follows. son livre can be his book or her book.", "ex": {"fr": "<em>ma<\/em> sœur et <em>ses<\/em> amis.", "en": "my sister and her friends."}}, {"h": "Vowels go masculine", "p": "Before a vowel, feminine nouns borrow mon, ton, son: mon amie, ton école.", "ex": {"fr": "<em>Mon<\/em> école est grande.", "en": "My school is big."}}]}, "t20": {"rules": [{"h": "ce, cet, cette, ces", "p": "ce before a consonant, cet before a vowel, cette for feminine, ces for plural. One set for near and far.", "ex": {"fr": "<em>Cet<\/em> appartement, <em>cette<\/em> cuisine.", "en": "this apartment, this kitchen."}}]}, "t21": {"rules": [{"h": "très boosts adjectives, beaucoup boosts verbs", "p": "très grand works, beaucoup grand does not. j'aime beaucoup works, j'aime très does not.", "ex": {"fr": "Ce gâteau est <em>très<\/em> bon, j'aime <em>beaucoup<\/em>.", "en": "This cake is very good, I like it a lot."}}, {"h": "trop = too", "p": "trop + adjective, trop de + noun.", "ex": {"fr": "C'est <em>trop<\/em> cher et il y a <em>trop de<\/em> monde.", "en": "It's too expensive and there are too many people."}}, {"h": "assez, peu, autant", "p": "assez = quite, peu = not very, before an adjective. Verbs compare with autant que, not aussi: il travaille autant que moi.", "ex": {"fr": "C'est <em>assez<\/em> bon, et il travaille <em>autant que<\/em> moi.", "en": "It's quite good, and he works as much as I do."}}, {"h": "Making adverbs: feminine + -ment", "p": "lent → lente → lentement; an adjective ending in a mute -e adds -ment directly (vraiment); -ant and -ent give -amment and -emment (évidemment). Irregulars: bon → bien, mauvais → mal.", "ex": {"fr": "Elle écoute <em>attentivement<\/em>, <em>évidemment<\/em>.", "en": "She listens attentively, obviously."}}, {"h": "Where adverbs sit", "p": "After the verb they modify (elle écoute attentivement), before an adjective or another adverb (très intelligent), and between auxiliary and participle in compound tenses (elle a bien mangé). Several adverbs stack manner, place, time.", "ex": {"fr": "Elle a <em>bien<\/em> mangé ; il court <em>rapidement<\/em> dans le parc <em>le matin<\/em>.", "en": "She ate well; he runs quickly in the park in the morning."}}]}, "t22": {"rules": [{"h": "on does everything", "p": "on replaces nous in everyday speech and conjugates like il: on va, on est, on mange.", "ex": {"fr": "<em>On y va<\/em> ?", "en": "Shall we go?"}}, {"h": "tu or vous", "p": "tu for friends, family and children; vous for strangers, teachers and groups. Unsure? vous.", "ex": {"fr": "Comment <em>vous<\/em> appelez-vous ?", "en": "What's your name? (formal)"}}, {"h": "il is often nobody", "p": "Weather, time and general statements use a dummy il: il pleut, il est trois heures, il faut. ils covers any group with one male; elles only all-female groups.", "ex": {"fr": "<em>Il<\/em> pleut, <em>il<\/em> est trois heures.", "en": "It's raining, it's three o'clock."}}]}, "t23": {"rules": [{"h": "After prepositions and for emphasis", "p": "moi, toi, lui, elle, nous, vous, eux, elles stand alone, follow c'est, or follow a preposition.", "ex": {"fr": "C'est <em>moi<\/em>. Viens avec <em>nous<\/em> !", "en": "It's me. Come with us!"}}]}, "t24": {"rules": [{"h": "Wrap the verb", "p": "ne before the conjugated verb, pas after. In casual speech the ne often falls silent.", "ex": {"fr": "Je <em>ne<\/em> comprends <em>pas<\/em>.", "en": "I don't understand."}}, {"h": "pas swaps out", "p": "jamais = never, plus = anymore. They take pas's slot: je ne mange jamais de viande.", "ex": {"fr": "Elle ne sort <em>plus<\/em> le soir.", "en": "She doesn't go out in the evenings anymore."}}, {"h": "Negating an infinitive", "p": "ne pas wraps the infinitive itself, not the governing verb: je préfère ne pas partir.", "ex": {"fr": "Je préfère <em>ne pas<\/em> partir.", "en": "I prefer not to leave."}}], "see": ["t16", "t50"]}, "t25": {"rules": [{"h": "Three roads, one meaning", "p": "Intonation: tu viens ? est-ce que: est-ce que tu viens ? inversion: viens-tu ?", "ex": {"fr": "<em>Est-ce que<\/em> tu viens avec nous ?", "en": "Are you coming with us?"}}, {"h": "The formality ladder", "p": "Intonation is casual, inversion is formal, est-ce que sits safely in the middle.", "ex": {"fr": "Où <em>habites-tu<\/em> ?", "en": "Where do you live? (formal)"}}, {"h": "Inversion fine print", "p": "A vowel-final verb takes a -t- bridge: va-t-il, parle-t-elle. Noun subjects stay in front: Marie vient-elle ? And je never inverts — use est-ce que je.", "ex": {"fr": "Où <em>habite-t<\/em>-elle ? <em>Marie vient-elle<\/em> ? <em>Est-ce que je<\/em> parle bien ?", "en": "Where does she live? Is Marie coming? Do I speak well?"}}]}, "t26": {"rules": [{"h": "The seven essentials", "p": "qui = who, que or quoi = what, où = where, quand = when, comment = how, pourquoi = why, combien = how much.", "ex": {"fr": "<em>Quand<\/em> est-ce qu'on part ? Demain.", "en": "When are we leaving? Tomorrow."}}, {"h": "que vs quoi", "p": "que opens the question and shrinks to qu' before a vowel; quoi takes over after a preposition and stands alone in casual speech.", "ex": {"fr": "<em>Qu'<\/em>est-ce que tu veux ? Tu fais <em>quoi<\/em> ?", "en": "What do you want? What are you doing?"}}, {"h": "qu'est-ce qui and combien de", "p": "When 'what' is the subject of its own question, it's qu'est-ce qui. combien takes de before a noun: combien de temps.", "ex": {"fr": "<em>Qu'est-ce qui<\/em> se passe ? <em>Combien de<\/em> temps ça prend ?", "en": "What's happening? How long does it take?"}}, {"h": "Embedded questions keep statement order", "p": "After savoir, demander, dire, no inversion — and que becomes ce que: je ne sais pas ce que tu veux.", "ex": {"fr": "Dis-moi <em>où tu habites<\/em>.", "en": "Tell me where you live."}}]}, "t27": {"rules": [{"h": "il y a = there is / there are", "p": "One form for singular and plural, and il y avait for the past.", "ex": {"fr": "<em>Il y a<\/em> du pain ?", "en": "Is there any bread?"}}, {"h": "voilà points, c'est identifies", "p": "voilà presents something you can see arriving; c'est names or labels it.", "ex": {"fr": "<em>Voilà<\/em> le bus ! <em>C'est<\/em> le nôtre.", "en": "There's the bus! It's ours."}}], "see": ["t28"]}, "t28": {"rules": [{"h": "c'est + noun, il est + adjective", "p": "With a noun or a modified noun, c'est. With a bare adjective about a person, il est.", "ex": {"fr": "<em>C'est<\/em> un bon film. Il <em>est<\/em> talentueux.", "en": "It's a good film. He's talented."}}, {"h": "il and elle refer back", "p": "Use il or elle when the subject is already in play; c'est when you label or announce.", "ex": {"fr": "Qui est-ce ? <em>C'est<\/em> Marie. Elle est là.", "en": "Who is it? It's Marie. She's here."}}]}, "t29": {"rules": [{"h": "Three clocks", "p": "dans = in (from now), depuis = for or since (still going), il y a = ago.", "ex": {"fr": "J'habite ici <em>depuis<\/em> trois ans.", "en": "I've lived here for three years."}}, {"h": "depuis keeps the present", "p": "French stays in the present with depuis; English switches to have + participle.", "ex": {"fr": "Il <em>travaille<\/em> depuis deux heures.", "en": "He's been working for two hours."}}]}, "t30": {"rules": [{"h": "à = at, de = from, dans = inside", "p": "à Paris, de Lyon, dans la chambre. Countries: en with feminine or vowel-initial names (en France, en Iran), au with masculine consonant ones (au Portugal, au Canada), aux with plurals (aux États-Unis).", "ex": {"fr": "Je rentre <em>dans<\/em> la maison, je viens <em>de<\/em> la boulangerie.", "en": "I'm going back into the house, I'm coming from the bakery."}}, {"h": "Coming from, heading toward", "p": "Coming from a country mirrors the à-side: de France (feminine or vowel), du Canada, des États-Unis. vers = toward, direction without arrival.", "ex": {"fr": "Je reviens <em>de<\/em> France et je marche <em>vers<\/em> la gare.", "en": "I'm coming back from France and walking toward the station."}}]}, "t31": {"rules": [{"h": "à for clocks, en for periods", "p": "à huit heures, en mars, en 2024, le lundi for every Monday, du lundi au vendredi.", "ex": {"fr": "On part <em>en<\/em> juin, <em>à<\/em> six heures.", "en": "We're leaving in June, at six."}}]}, "t32": {"rules": [{"h": "The four basic connectors", "p": "et = and, ou = or, mais = but, alors = so or then. They join clauses without commas.", "ex": {"fr": "Je voudrais un thé <em>ou<\/em> un café, <em>mais<\/em> sans lait.", "en": "I'd like tea or coffee, but no milk."}}]}, "t33": {"rules": [{"h": "The default auxiliary", "p": "Every verb takes avoir except the être band and pronominals.", "ex": {"fr": "Elle <em>a acheté<\/em> une voiture.", "en": "She bought a car."}}, {"h": "-ir and -re participles", "p": "finir → fini. Regular -re verbs drop the re and add -u: attendre → attendu, vendre → vendu, rendre → rendu. Two irregular families: prendre → pris (apprendre, comprendre, reprendre), mettre → mis (permettre, promettre).", "ex": {"fr": "J'<em>ai attendu<\/em>, puis j'<em>ai pris<\/em> le bus.", "en": "I waited, then took the bus."}}, {"h": "The irregular participles to know", "p": "eu, été, fait, pris, mis, vu, dit, su, voulu, pu, dû, bu, lu — most compound tenses lean on these. Used as an adjective, the participle agrees like one: une table cassée.", "ex": {"fr": "Il a <em>pris<\/em> son temps et a <em>bu<\/em> son café ; une lettre <em>écrite<\/em> à la main.", "en": "He took his time and drank his coffee; a handwritten letter."}}]}, "t34": {"rules": [{"h": "The house verbs", "p": "Seventeen verbs of coming, going and staying take être: aller, arriver, descendre, devenir, entrer, monter, mourir, naître, partir, passer, rentrer, rester, retourner, revenir, sortir, tomber, venir. Every prefixed cousin follows its parent: redevenir, repartir, ressortir.", "ex": {"fr": "Ils <em>sont partis<\/em> à l'aube.", "en": "They left at dawn."}}, {"h": "The participle agrees", "p": "With être the participle works like an adjective: elle est allée, elles sont allées.", "ex": {"fr": "Marie <em>est montée<\/em> avec ses valises.", "en": "Marie went up with her suitcases."}}, {"h": "Movement fine print", "p": "Each verb drags its preposition: aller à Paris, venir de Lyon, entrer dans la maison, sortir du cinéma. aller moves away from the speaker, venir toward. sortir crosses a boundary out; partir is the departure itself.", "ex": {"fr": "Je <em>vais<\/em> au marché, tu <em>viens<\/em> ? Il <em>sort de<\/em> la voiture et <em>part<\/em> pour Lyon.", "en": "I'm going to the market, coming? He gets out of the car and leaves for Lyon."}}], "exc": "monter, descendre, rentrer, retourner, sortir and passer take avoir when a direct object follows: j'ai monté les valises, j'ai retourné les crêpes, j'ai passé une heure là-bas."}, "t35": {"rules": [{"h": "One stem for everyone", "p": "Take the nous form of the present, drop -ons, add -ais, -ais, -ait, -ions, -iez, -aient. Only être misbehaves: ét-.", "ex": {"fr": "Nous <em>chantions<\/em>, vous <em>chantiez<\/em>.", "en": "We sang, you sang."}}, {"h": "What it's for", "p": "Descriptions, habits, weather, feelings, background. Anything that lasted without a deadline.", "ex": {"fr": "Quand j'étais petit, il y <em>avait<\/em> un parc ici.", "en": "When I was little, there was a park here."}}]}, "t36": {"rules": [{"h": "Scene vs action", "p": "Imparfait paints the scene: weather, age, mood. Passé composé moves the plot: what happened next.", "ex": {"fr": "Il <em>pleuvait<\/em> quand je <em>suis sorti<\/em>.", "en": "It was raining when I went out."}}, {"h": "Habit vs event", "p": "An uncounted habit with toujours or chaque été takes imparfait; a counted series of events takes passé composé.", "ex": {"fr": "Chaque été nous <em>allions<\/em> à la mer ; un jour, nous <em>avons pris<\/em> le train.", "en": "Every summer we went to the sea; one day we took the train."}}, {"h": "Stative verbs stay imparfait", "p": "savoir, croire, vouloir, pouvoir, aimer describe states and default to imparfait. The passé composé marks the moment the state begins: j'ai su = I found out.", "ex": {"fr": "Je <em>savais<\/em> la réponse ; quand j'<em>ai su<\/em> la vérité, j'ai pleuré.", "en": "I knew the answer; when I learned the truth, I cried."}}, {"h": "A closed span takes passé composé", "p": "pendant + a measured, finished span → passé composé: j'ai habité à Paris pendant deux ans (it's over). Open description with no endpoint → imparfait: j'habitais à Paris.", "ex": {"fr": "J'<em>ai habité<\/em> à Paris pendant deux ans.", "en": "I lived in Paris for two years."}}], "see": ["t35", "t33", "t34"]}, "t37": {"rules": [{"h": "Infinitive + avoir's endings", "p": "parler → je parlerai, finir → je finirai. Endings: -ai, -as, -a, -ons, -ez, -ont.", "ex": {"fr": "Tu <em>verras<\/em>, tout <em>ira<\/em> bien.", "en": "You'll see, everything will be fine."}}, {"h": "The irregular stems", "p": "être → ser-, avoir → aur-, aller → ir-, faire → fer-, venir → viendr-, tenir → tiendr-, voir → verr-, savoir → saur-, pouvoir → pourr-, vouloir → voudr-, devoir → devr-, recevoir → recevr-, envoyer → enverr-, courir → courr-, mourir → mourr-, valoir → vaudr-, acquérir → acquerr-; falloir → il faudra, pleuvoir → il pleuvra.", "ex": {"fr": "J'<em>aurai<\/em> le temps, je <em>ferai<\/em> ça demain.", "en": "I'll have time, I'll do that tomorrow."}}, {"h": "quand takes the futur", "p": "After quand, lorsque, dès que pointing at the future, French uses the futur where English keeps the present.", "ex": {"fr": "Quand tu <em>arriveras<\/em>, appelle-moi.", "en": "When you arrive, call me."}}], "exc": "appeler and jeter double their consonant: j'appellerai, je jetterai."}, "t38": {"rules": [{"h": "Some verbs need a bridge", "p": "décider de, penser à, rêver de, s'intéresser à, avoir besoin de. The preposition is part of the verb; learn the pair.", "ex": {"fr": "Elle <em>rêve de<\/em> voyager.", "en": "She dreams of travelling."}}, {"h": "Second verb stays an infinitive", "p": "je commence à travailler, j'ai peur de voler, il continue à manger.", "ex": {"fr": "Il a commencé <em>à pleuvoir<\/em>.", "en": "It started to rain."}}, {"h": "A few verbs bridge with en", "p": "croire en (believe in) and avoir confiance en. And jouer splits: jouer à = games and sports, jouer de = instruments.", "ex": {"fr": "Je <em>crois en<\/em> toi ; je joue <em>au<\/em> foot et <em>du<\/em> piano.", "en": "I believe in you; I play football and the piano."}}], "exc": "Same verb, different bridge, different meaning: penser à quelqu'un (think of someone) vs penser de (have an opinion about)."}, "t39": {"rules": [{"h": "plus, aussi, moins", "p": "plus rapide que, aussi rapide que, moins rapide que. The adjective sits in the middle, que does the comparing.", "ex": {"fr": "Le train est <em>plus rapide que<\/em> le bus.", "en": "The train is faster than the bus."}}, {"h": "bon and mauvais go irregular", "p": "meilleur = better, pire = worse. Plus bon doesn't exist; plus mauvais exists but pire is the usual choice. bien compares with mieux, never plus bien.", "ex": {"fr": "Il chante <em>mieux<\/em> que moi.", "en": "He sings better than me."}}, {"h": "de plus en plus", "p": "de plus en plus = more and more, de moins en moins = less and less, fixed order, before the adjective.", "ex": {"fr": "C'est de <em>plus en plus<\/em> difficile.", "en": "It's more and more difficult."}}]}, "t40": {"rules": [{"h": "le plus, le moins", "p": "le plus grand, la plus petite, les moins chers. The article turns the comparative into a superlative.", "ex": {"fr": "C'est <em>la meilleure<\/em> pâtisserie de la ville.", "en": "It's the best bakery in town."}}, {"h": "bon → le meilleur, mauvais → le pire", "p": "The irregular pair carries into the superlative.", "ex": {"fr": "C'est <em>le pire<\/em> jour de ma vie.", "en": "It's the worst day of my life."}}]}, "t41": {"rules": [{"h": "Replace the thing", "p": "me, te, le, la, nous, vous, les stand before the conjugated verb: je vois Marie → je la vois.", "ex": {"fr": "Tu connais Léa ? Oui, je <em>la<\/em> connais.", "en": "Do you know Léa? Yes, I know her."}}, {"h": "me te nous vous come first", "p": "Before le la les: il me le donne. In the passé composé the pronoun climbs before the auxiliary.", "ex": {"fr": "Elle <em>me l'<\/em>a donné hier.", "en": "She gave it to me yesterday."}}]}, "t42": {"rules": [{"h": "Replace the person after à", "p": "à Paul → lui, à mes parents → leur. lui covers him and her alike.", "ex": {"fr": "Je téléphone à Paul → je <em>lui<\/em> téléphone.", "en": "I'm calling Paul → I'm calling him."}}, {"h": "Only with à-verbs", "p": "Téléphoner à, parler à, écrire à, offrir à. If there's no à, you need a direct pronoun.", "ex": {"fr": "Je <em>leur<\/em> ai écrit une carte.", "en": "I wrote them a card."}}, {"h": "me, te, nous, vous go both ways", "p": "First and second persons use one pronoun for direct and indirect: il me voit, il me parle. lui and leur exist only in the third person.", "ex": {"fr": "Il <em>me<\/em> voit et il <em>me<\/em> parle.", "en": "He sees me and he speaks to me."}}], "see": ["t41"]}, "t43": {"rules": [{"h": "en replaces de + noun", "p": "du pain → j'en prends, de l'espoir → j'en ai. If the phrase runs on de, en can stand in for the noun.", "ex": {"fr": "Tu veux du café ? J'<em>en<\/em> veux bien.", "en": "Want some coffee? I'd love some."}}, {"h": "en with numbers", "p": "After a number or quantity, en holds the counted noun's place: j'en veux deux, il y en a beaucoup.", "ex": {"fr": "J'<em>en<\/em> ai acheté trois.", "en": "I bought three."}}], "see": ["t44", "t16"]}, "t44": {"rules": [{"h": "y = there, for places", "p": "y replaces any location phrase: à + place (je vais à Paris → j'y vais), but also dans, sur, chez (chez le médecin → j'y vais). It also covers verbs that take à + thing, like penser à and croire à.", "ex": {"fr": "Tu vas au marché ? J'<em>y<\/em> vais maintenant.", "en": "Are you going to the market? I'm on my way there."}}, {"h": "Never for people", "p": "For à + person, keep à with a stressed pronoun: je pense à toi stays.", "ex": {"fr": "Je vais à la banque, puis j'<em>y<\/em> retire de l'argent.", "en": "I'm going to the bank, then I'll withdraw money there."}}]}, "t45": {"rules": [{"h": "we, people, you", "p": "on replaces nous in speech, makes generic statements (on ne sait jamais), and even means 'you' in recipes and instructions.", "ex": {"fr": "<em>On<\/em> se retrouve à huit heures ?", "en": "Shall we meet at eight?"}}, {"h": "on shrinks before vowels", "p": "on a, on est, and in the negative on n'a pas, on n'est pas.", "ex": {"fr": "<em>On n'a<\/em> pas le choix.", "en": "We have no choice."}}]}, "t46": {"rules": [{"h": "Doer, done-to, place", "p": "qui is the subject (l'homme qui parle), que is the object (le film que j'ai vu), où is place or time (la ville où je suis né).", "ex": {"fr": "la femme <em>qui<\/em> chante, la chanson <em>que<\/em> j'aime.", "en": "the woman who sings, the song I love."}}, {"h": "que becomes qu'", "p": "Before a vowel, drop the e: le film qu'on a vu.", "ex": {"fr": "le livre <em>qu'<\/em>elle lit.", "en": "the book she's reading."}}]}, "t47": {"rules": [{"h": "le mien, la tienne, les siens", "p": "The standalone possessive agrees with the thing owned, not the owner: ma voiture → la mienne.", "ex": {"fr": "Tu prends ta voiture ou <em>la mienne<\/em> ?", "en": "Are you taking your car or mine?"}}, {"h": "The circumflex three", "p": "notre → le nôtre, votre → le vôtre, leur → le leur. Everyone else is plain: le mien, la tienne, les siens.", "ex": {"fr": "Notre maison est plus grande que <em>la vôtre<\/em>.", "en": "Our house is bigger than yours."}}]}, "t48": {"rules": [{"h": "Four shapes", "p": "tout, toute, tous, toutes modify a noun and agree with it: tous les enfants, toute la journée.", "ex": {"fr": "<em>tous<\/em> les enfants, <em>toute<\/em> la journée.", "en": "all the children, the whole day."}}, {"h": "The adverb agrees by sound", "p": "Before a feminine adjective starting with a consonant, tout agrees: toute contente, toutes contentes. Before a vowel it stays put: tout étonnée.", "ex": {"fr": "Elle est <em>toute<\/em> contente mais <em>tout<\/em> étonnée.", "en": "She's quite happy but quite surprised."}}, {"h": "tous the pronoun sounds 'tooss'", "p": "Ils sont venus tous keeps the s sound; tous les jours drops it.", "ex": {"fr": "Ils sont venus <em>tous<\/em> (tooss) ; <em>tous<\/em> les jours (tou).", "en": "They all came; every day."}}]}, "t49": {"rules": [{"h": "ça does the daily work", "p": "ça is the spoken all-purpose 'it / that'. cela is the same word dressed up for writing; ceci points at the closer thing.", "ex": {"fr": "<em>Ça<\/em> marche pour demain ?", "en": "Does that work for tomorrow?"}}, {"h": "celui, celle, ceux, celles = the one(s)", "p": "Standalone 'the one / the ones', agreeing with the noun it replaces. celui-ci = this one, celui-là = that one. Never point at a person with ceci or cela — use the celui series.", "ex": {"fr": "Mes clés ? Prends <em>celles<\/em> de la cuisine.", "en": "My keys? Take the ones from the kitchen."}}, {"h": "celui qui = the one who", "p": "Free relative, people or things: celui qui travaille gagne. With a plural predicate, c'est becomes ce sont: ce sont eux.", "ex": {"fr": "<em>Celui qui<\/em> travaille gagne. <em>Ce sont<\/em> eux.", "en": "The one who works wins. It's them."}}]}, "t50": {"rules": [{"h": "pas swaps out", "p": "plus = anymore, rien = nothing, personne = no one. They take pas's slot after the verb.", "ex": {"fr": "Je n'ai <em>plus<\/em> d'argent.", "en": "I have no money left."}}, {"h": "rien and personne can lead", "p": "As subjects they come first, and ne still guards the verb: personne ne sait, rien n'a changé.", "ex": {"fr": "<em>Personne ne<\/em> comprend.", "en": "Nobody understands."}}, {"h": "Negatives stack, never cancel", "p": "Two negatives in one sentence intensify: je ne comprends jamais rien, personne n'a plus rien. Unlike English, they never make a positive.", "ex": {"fr": "Je ne comprends <em>jamais rien<\/em>.", "en": "I never understand anything."}}]}, "t51": {"rules": [{"h": "que and comme = how", "p": "Que c'est beau ! Comme il pleut ! Both boost a whole clause.", "ex": {"fr": "<em>Qu'<\/em>elle est belle, cette ville !", "en": "How beautiful this city is!"}}, {"h": "quel + noun", "p": "quel agrees with the noun it boosts: quelle idée ! quelles vacances !", "ex": {"fr": "<em>Quelle<\/em> surprise !", "en": "What a surprise!"}}]}, "t52": {"rules": [{"h": "parce que answers why", "p": "The cause clause follows the result: je reste parce qu'il pleut.", "ex": {"fr": "Je reste <em>parce qu'<\/em>il pleut.", "en": "I'm staying because it's raining."}}, {"h": "donc points forward", "p": "donc announces the consequence: il pleut, donc je reste. car is a softer cause, tacked on after a comma.", "ex": {"fr": "Il pleut, <em>donc<\/em> je reste.", "en": "It's raining, so I'm staying."}}]}, "t53": {"rules": [{"h": "pour + infinitive = aim", "p": "It answers 'what for?' When a new person enters the aim, graduate to pour que + subjunctive (B1).", "ex": {"fr": "Je suis venue <em>pour<\/em> t'<em>aider<\/em>.", "en": "I came to help you."}}, {"h": "mais vs pourtant", "p": "mais joins opposites; pourtant concedes one: c'est loin, pourtant on y va.", "ex": {"fr": "C'est loin, <em>pourtant<\/em> on y va.", "en": "It's far, yet we're going."}}]}, "t54": {"rules": [{"h": "The story ladder", "p": "d'abord = first, puis or ensuite = then, enfin = finally.", "ex": {"fr": "<em>D'abord<\/em> on mange, <em>ensuite<\/em> on joue, <em>enfin<\/em> on dort.", "en": "First we eat, then we play, finally we sleep."}}]}, "t55": {"rules": [{"h": "The past before the past", "p": "Imparfait of avoir or être + participle: j'avais mangé, j'étais parti. For an action already done before another past one.", "ex": {"fr": "Quand je suis arrivé, ils <em>avaient déjà<\/em> mangé.", "en": "When I arrived, they had already eaten."}}], "see": ["t35"]}, "t56": {"rules": [{"h": "Imparfait sets, passé composé acts", "p": "Descriptions and states take imparfait; events take passé composé, or passé simple in writing.", "ex": {"fr": "La nuit <em>tombait<\/em> quand le téléphone <em>a sonné<\/em>.", "en": "Night was falling when the phone rang."}}, {"h": "Plus-que-parfait for backstory", "p": "Anything that happened before your story's timeline gets plus-que-parfait.", "ex": {"fr": "Elle <em>avait oublié<\/em> ses clés, donc elle attendait dehors.", "en": "She had forgotten her keys, so she waited outside."}}]}, "t57": {"rules": [{"h": "avoir agrees when the object goes first", "p": "The participle agrees with a direct object placed before the verb: les fleurs que j'ai achetées, je les ai vues.", "ex": {"fr": "les lettres qu'elle <em>a écrites<\/em>.", "en": "the letters she wrote."}}, {"h": "Object after = no agreement", "p": "j'ai écrit des lettres stays put. Only a preposed object (relative que or an object pronoun) triggers agreement.", "ex": {"fr": "Je les <em>ai vues<\/em> hier.", "en": "I saw them (them = women) yesterday."}}]}, "t58": {"rules": [{"h": "Futur stem + imparfait endings", "p": "je parlerais, je finirais. Take the futur stem and hang the imparfait endings on it: -ais, -ais, -ait, -ions, -iez, -aient.", "ex": {"fr": "J'<em>aimerais<\/em> un verre d'eau.", "en": "I'd like a glass of water."}}, {"h": "The stems copy the futur simple", "p": "Every irregular futur stem carries over: je serais, j'aurais, j'irais, je ferais, je viendrais, je verrais, je saurais, je pourrais, je voudrais, je devrais.", "ex": {"fr": "À ta place, je <em>ferais<\/em> attention.", "en": "In your place, I'd be careful."}}]}, "t59": {"rules": [{"h": "Wish, request, hypothesis", "p": "je voudrais softens a request, j'aimerais states a wish, and the conditionnel completes an unreal si-clause.", "ex": {"fr": "Je <em>viendrais<\/em> bien, mais je travaille.", "en": "I'd love to come, but I'm working."}}, {"h": "The future of yesterday", "p": "In reported speech and news, a past future becomes conditionnel: il a dit qu'il viendrait.", "ex": {"fr": "Elle a promis qu'elle <em>appellerait<\/em>.", "en": "She promised she would call."}}, {"h": "The journalist's conditionnel", "p": "The conditionnel marks unconfirmed, second-hand information — the speaker isn't vouching for it. Constant in news.", "ex": {"fr": "Le suspect <em>serait<\/em> en fuite.", "en": "The suspect is reportedly on the run."}}]}, "t60": {"rules": [{"h": "Mostly looks like the present", "p": "que je parle, que je finisse, que je vende. nous and vous borrow the imparfait stem: que je vienne, que nous venions.", "ex": {"fr": "Il faut que tu <em>viennes<\/em>.", "en": "You have to come."}}, {"h": "The irregulars", "p": "être → soit, avoir → ait, aller → aille, faire → fasse, pouvoir → puisse, savoir → sache, vouloir → veuille, valoir → vaille, falloir → qu'il faille, pleuvoir → qu'il pleuve.", "ex": {"fr": "pour que tu <em>sois<\/em> là.", "en": "so that you're there."}}]}, "t61": {"rules": [{"h": "Feelings and wants trigger it", "p": "After je veux que, je suis content que, il est dommage que, c'est triste que, the next verb goes subjunctive.", "ex": {"fr": "Je suis ravi que tu <em>sois<\/em> là.", "en": "I'm delighted you're here."}}, {"h": "il faut que + subjunctive", "p": "il faut que tu fasses. With no second subject, keep the infinitive: il faut partir.", "ex": {"fr": "Il faut qu'on <em>parte<\/em>.", "en": "We have to leave."}}], "exc": "Certainty verbs go the other way: je sais que, il est clair que take the indicative.", "see": ["t60", "t62"]}, "t62": {"rules": [{"h": "Doubt vs certainty", "p": "Subjective or uncertain triggers (il faut que, bien que, je doute que) take subjunctive. Stated as fact (je pense que, il est certain que) take indicative.", "ex": {"fr": "Je pense qu'il <em>est<\/em> là, mais je doute qu'il <em>reste<\/em>.", "en": "I think he's there, but I doubt he'll stay."}}, {"h": "Opinion flips with negation", "p": "je pense que → indicative; je ne pense pas que → subjunctive. Negating an opinion plants doubt.", "ex": {"fr": "Je ne pense pas qu'elle <em>vienne<\/em>.", "en": "I don't think she's coming."}}]}, "t63": {"rules": [{"h": "être + participle", "p": "The thing becomes the subject: ce tableau a été peint par Picasso. par introduces the doer.", "ex": {"fr": "La souris <em>a été mangée<\/em> par le chat.", "en": "The mouse was eaten by the cat."}}, {"h": "Spoken French avoids it", "p": "On + active verb does the same job and sounds normal: on a volé ma voiture.", "ex": {"fr": "<em>On m'a volé<\/em> mon vélo.", "en": "Someone stole my bike."}}]}, "t64": {"rules": [{"h": "en + -ant", "p": "Means 'by doing' or 'while doing'. The en-form shares its subject with the main verb, and the -ant never agrees.", "ex": {"fr": "Il apprend le français <em>en écoutant<\/em> la radio ; elles chantaient <em>en marchant<\/em>.", "en": "He learns French by listening to the radio; they sang while walking."}}, {"h": "Form it from the nous form", "p": "Drop -ons, add -ant: parler → en parlant, finir → en finissant. The odd ones: avoir → ayant, savoir → sachant.", "ex": {"fr": "C'est en <em>sachant<\/em> écouter qu'on apprend.", "en": "You learn by knowing how to listen."}}]}, "t65": {"rules": [{"h": "Verb becomes noun", "p": "arriver → l'arrivée, développer → le développement. Formal writing prefers the noun version of an action.", "ex": {"fr": "<em>La construction<\/em> du pont a pris deux ans.", "en": "The construction of the bridge took two years."}}, {"h": "Adjective becomes noun
