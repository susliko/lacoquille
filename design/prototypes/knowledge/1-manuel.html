", "p": "utile → l'utilité, possible → la possibilité. -ité and -(t)ion do most of the work.", "ex": {"fr": "C'est d'une grande <em>utilité<\/em>.", "en": "It's of great use."}}, {"h": "The infinitive as a noun", "p": "The infinitive itself can be the subject or object where English uses the -ing form: mentir est mal, j'aime dormir.", "ex": {"fr": "<em>Mentir<\/em> est mal.", "en": "Lying is wrong."}}]}, "t66": {"rules": [{"h": "The order line", "p": "me te nous vous → le la les → lui leur → y → en. Il me le donne fits all three first slots.", "ex": {"fr": "Elle <em>me l'<\/em>a offert pour mon anniversaire.", "en": "She gave it to me for my birthday."}}, {"h": "The imperative exception", "p": "Positive commands attach the pronouns after the verb: donne-le-moi. Negative ones wrap as usual: ne me le donne pas.", "ex": {"fr": "Donnez-<em>le-moi<\/em> !", "en": "Give it to me!"}}, {"h": "Elide when they touch", "p": "me, te, le, la shrink before y and en: m'y, t'en, l'y, l'en. And lui/leur never combine with y — one or the other.", "ex": {"fr": "Il <em>m'y<\/em> envoie demain.", "en": "He's sending me there tomorrow."}}]}, "t67": {"rules": [{"h": "dont = de + which", "p": "For anything the verb links with de: le livre dont je parle (parler de), la chanson dont il se souvient (se souvenir de).", "ex": {"fr": "le film <em>dont<\/em> tout le monde parle.", "en": "the film everyone's talking about."}}, {"h": "dont also owns", "p": "Possession with de: la voisine dont le chien aboie. Whose, when the sentence runs on de.", "ex": {"fr": "un auteur <em>dont<\/em> les livres se vendent bien.", "en": "an author whose books sell well."}}]}, "t68": {"rules": [{"h": "Preposition + lequel", "p": "avec lequel, à laquelle, dans lesquels. lequel agrees in gender and number with what it replaces.", "ex": {"fr": "la table <em>sur laquelle<\/em> je travaille.", "en": "the table I work on."}}, {"h": "People still get qui", "p": "After a preposition naming a person, qui does the job: l'ami avec qui je voyage.", "ex": {"fr": "un ami <em>avec qui<\/em> je voyage souvent.", "en": "a friend I often travel with."}}]}, "t69": {"rules": [{"h": "someone, everyone, nobody", "p": "quelqu'un, tout le monde, personne ne, rien ne, quelque chose, tout. personne and rien need ne.", "ex": {"fr": "<em>Tout le monde<\/em> est là, <em>personne ne<\/em> manque.", "en": "Everyone's here, nobody's missing."}}, {"h": "de before an adjective", "p": "quelque chose, quelqu'un, rien take de + adjective: quelque chose de beau, quelqu'un de gentil, rien d'intéressant.", "ex": {"fr": "C'est <em>quelqu'un de<\/em> très gentil.", "en": "He/she is someone very kind."}}, {"h": "The rest of the band", "p": "chacun = each one, quelques-unes = some (agrees), plusieurs = several, certains = some, d'autres = others.", "ex": {"fr": "J'ai lu <em>quelques-uns<\/em> de ses livres.", "en": "I've read a few of his books."}}]}, "t70": {"rules": [{"h": "When the whole clause is the object", "p": "ce qui = what (subject of its clause), ce que = what (object), ce dont = what (after de).", "ex": {"fr": "Je sais <em>ce que<\/em> tu veux ; <em>ce qui<\/em> compte, c'est l'effort.", "en": "I know what you want; what matters is effort."}}]}, "t71": {"rules": [{"h": "Real condition", "p": "si + present in the if-half, future or present in the other half. Never a future after si itself.", "ex": {"fr": "<em>Si<\/em> tu veux, on <em>ira<\/em> à la plage.", "en": "If you want, we'll go to the beach."}}]}, "t72": {"rules": [{"h": "The daydream si", "p": "si + imparfait → conditionnel in the other half. Unreal today, but still daydreamable.", "ex": {"fr": "<em>Si j'avais<\/em> le temps, j'<em>achèterais<\/em> une maison.", "en": "If I had the time, I'd buy a house."}}, {"h": "The conditionnel never follows si", "p": "The mistake everyone makes: si j'aurais. The if-half takes imparfait, only the other half gets the conditionnel.", "ex": {"fr": "<em>Si j'étais<\/em> toi, je <em>ferais<\/em> attention.", "en": "If I were you, I'd be careful."}}], "see": ["t59", "t91"]}, "t73": {"rules": [{"h": "One step back in time", "p": "Present → imparfait, passé composé → plus-que-parfait, futur → conditionnel. 'Je pars' becomes il a dit qu'il partait.", "ex": {"fr": "« J'arrive » → Elle a dit qu'elle <em>arrivait<\/em>.", "en": "'I'm arriving.' → She said she was arriving."}}, {"h": "Reporting a question", "p": "Yes/no questions report with si. Wh-questions keep their word in statement order, no inversion.", "ex": {"fr": "Elle m'a demandé <em>si<\/em> je venais ; il a demandé <em>où j'allais<\/em>.", "en": "She asked if I was coming; he asked where I was going."}}, {"h": "Reporting a command", "p": "A command becomes de + infinitive after dire or demander. Negatives keep ne pas before the infinitive: elle nous a demandé de ne pas partir.", "ex": {"fr": "Il m'a dit <em>de fermer<\/em> la porte.", "en": "He told me to close the door."}}], "see": ["t83"]}, "t74": {"rules": [{"h": "ne… que = only", "p": "que lands after the verb and limits it: je n'ai que cinq euros. Keep the ne in writing.", "ex": {"fr": "Il ne reste <em>que<\/em> deux places.", "en": "Only two tickets are left."}}, {"h": "aucun and ni… ni", "p": "aucun + ne = not a single one; ni… ni = neither nor, with a single ne.", "ex": {"fr": "Je n'ai <em>ni<\/em> le temps <em>ni<\/em> l'envie.", "en": "I have neither the time nor the desire."}}]}, "t75": {"rules": [{"h": "comme, puisque, car", "p": "comme opens the sentence (Comme il pleut, restons), puisque cites a known cause, car explains mid-sentence.", "ex": {"fr": "<em>Puisque<\/em> tu insistes, je reste.", "en": "Since you insist, I'll stay."}}, {"h": "Announcing the result", "p": "donc, c'est pourquoi, c'est pour ça que all point forward to the consequence.", "ex": {"fr": "Il pleuvait ; <em>c'est pourquoi<\/em> on a annulé.", "en": "It was raining; that's why we cancelled."}}]}, "t76": {"rules": [{"h": "Same aim, two grammars", "p": "pour que + subjunctive when a new subject acts; pour or afin de + infinitive when the subject stays. The same split runs through avant: avant de partir, avant qu'il parte.", "ex": {"fr": "Je parle lentement <em>pour que tu comprennes<\/em> ; <em>avant de partir<\/em>, ferme la porte.", "en": "I speak slowly so that you understand; before leaving, close the door."}}]}, "t77": {"rules": [{"h": "bien que + subjunctive", "p": "Concede, then counter. bien que takes the subjunctive; même si takes the indicative.", "ex": {"fr": "<em>Bien qu'il soit<\/em> tard, on continue.", "en": "Although it's late, we carry on."}}]}, "t78": {"rules": [{"h": "Spotlight construction", "p": "Ce qui + verb + c'est + the star of the sentence. The star usually comes last, where the emphasis lives.", "ex": {"fr": "<em>Ce qui m'énerve<\/em>, <em>c'est<\/em> le bruit.", "en": "What annoys me is the noise."}}]}, "t79": {"rules": [{"h": "il est + adjective + de", "p": "For general statements about things: il est important de venir. Switch to c'est when you point at a specific one with a noun.", "ex": {"fr": "<em>Il est<\/em> important <em>de<\/em> venir à l'heure.", "en": "It's important to arrive on time."}}]}, "t80": {"rules": [{"h": "The storyteller's toolkit", "p": "un matin, soudain, puis, enfin, le lendemain. They pace the story; imparfait runs underneath, events land in passé composé.", "ex": {"fr": "<em>Soudain<\/em>, la lumière <em>s'est éteinte<\/em>.", "en": "Suddenly, the light went out."}}]}, "t81": {"rules": [{"h": "Future before future", "p": "Futur of avoir or être + participle: j'aurai fini, je serai rentré. For an action done before another future one.", "ex": {"fr": "Quand tu arriveras, j'<em>aurai déjà mangé<\/em>.", "en": "When you arrive, I'll have already eaten."}}, {"h": "After quand, dès que", "p": "Inside a time clause, a future action that must complete first lands in the futur antérieur.", "ex": {"fr": "Quand tu <em>auras fini<\/em>, appelle-moi.", "en": "When you've finished, call me."}}], "see": ["t37"]}, "t82": {"rules": [{"h": "avoir or être + participle, as an infinitive", "p": "après avoir mangé, après être rentré. Keeps the infinitive after a preposition while pointing at the past.", "ex": {"fr": "Après <em>avoir travaillé<\/em>, il dort.", "en": "After working, he sleeps."}}, {"h": "être past infinitives agree", "p": "après être partis, après être partie. Same agreement rule as the passé composé.", "ex": {"fr": "après <em>être rentrés<\/em> du voyage.", "en": "after coming back from the trip."}}, {"h": "ayant fini, étant parti", "p": "The participle has its own past: ayant + participle, étant + participle. The action finished before the main one.", "ex": {"fr": "<em>Ayant fini<\/em> son travail, il est sorti.", "en": "Having finished his work, he went out."}}]}, "t83": {"rules": [{"h": "The main clause sets the floor", "p": "il dit qu'il viendra (present → future), il a dit qu'il viendrait (past → conditionnel). Each step back shifts the subordinate one step too.", "ex": {"fr": "Il a dit qu'il <em>viendrait<\/em> le lendemain.", "en": "He said he would come the next day."}}, {"h": "Time words shift with tenses", "p": "demain → le lendemain, hier → la veille, aujourd'hui → ce jour-là.", "ex": {"fr": "« Demain » → <em>le lendemain<\/em> ; « hier » → <em>la veille<\/em>.", "en": "'tomorrow' → 'the next day'; 'yesterday' → 'the day before'."}}]}, "t84": {"rules": [{"h": "faire never agrees", "p": "With faire + infinitive, the participle stays frozen: les robes qu'elle a fait coudre.", "ex": {"fr": "les meubles qu'elle <em>a fait<\/em> livrer.", "en": "the furniture she had delivered."}}, {"h": "Pronominals with indirect objects don't agree", "p": "elles se sont parlé, elles se sont téléphoné: parler à and téléphoner à make the object indirect, and agreement dies.", "ex": {"fr": "Elles se <em>sont téléphoné<\/em> hier soir.", "en": "They called each other last night."}}]}, "t85": {"rules": [{"h": "The regret machine", "p": "aurais or serais + participle: j'aurais dit, je serais venu. Pairs with si + plus-que-parfait for the past that never happened.", "ex": {"fr": "<em>Si j'avais su<\/em>, je <em>serais venu<\/em>.", "en": "If I'd known, I'd have come."}}, {"h": "Standalone reproach", "p": "With no si-clause at all, the conditionnel passé scolds or regrets — the hypothesis stays unspoken.", "ex": {"fr": "Tu <em>aurais pu<\/em> me prévenir !", "en": "You could have warned me!"}}]}, "t86": {"rules": [{"h": "Want, doubt, deny", "p": "vouloir, douter, nier, craindre, éviter que + subjunctive. Impersonals follow: il est possible que, il vaut mieux que.", "ex": {"fr": "Je doute qu'il <em>vienne<\/em>.", "en": "I doubt he'll come."}}, {"h": "Certainty and stating go indicative", "p": "je suis sûr que, il est évident que, il dit que. But nier and douter stay subjunctive even though they sound certain.", "ex": {"fr": "Je nie qu'il <em>ait menti<\/em>.", "en": "I deny that he lied."}}, {"h": "Superlatives and uniqueness", "p": "After le meilleur, le seul, le premier, le dernier, the subordinate verb often goes subjunctive.", "ex": {"fr": "C'est le meilleur film que j'<em>aie<\/em> vu.", "en": "It's the best film I've seen."}}], "exc": "Affirmative espérer que takes the indicative: j'espère qu'il vient. Only negated or questioned espérer leans subjunctive."}, "t87": {"rules": [{"h": "Learn the gang as one block", "p": "pour que, afin que, avant que, bien que, quoique, jusqu'à ce que, à condition que, à moins que, pourvu que, sans que, de peur que always take the subjunctive. No exceptions to weigh.", "ex": {"fr": "Reste ici <em>jusqu'à ce qu'il revienne<\/em>.", "en": "Stay here until he comes back."}}, {"h": "The holdout: après que", "p": "après que describes something that already happened, so it takes the indicative: après qu'il est parti.", "ex": {"fr": "après qu'elle <em>est rentrée<\/em>.", "en": "after she got home."}}]}, "t88": {"rules": [{"h": "avoir or être subjunctive + participle", "p": "qu'il ait fini, qu'elle soit partie. The subjunctive action finished before the main one.", "ex": {"fr": "Je regrette qu'elle <em>ait refusé<\/em>.", "en": "I regret that she refused."}}]}, "t89": {"rules": [{"h": "Two spellings, two jobs", "p": "The adjective describes (un professeur négligent), the participle acts (en négligeant sa santé).", "ex": {"fr": "un professeur <em>négligent<\/em> / en <em>négligeant<\/em> sa santé.", "en": "a careless teacher / by neglecting his health."}}, {"h": "The common pairs", "p": "excellent / excellant, précédent / précédant, convaincant / convainquant, différent / différant.", "ex": {"fr": "un argument <em>convaincant<\/em>.", "en": "a convincing argument."}}]}, "t90": {"rules": [{"h": "Which one, agreeing", "p": "lequel, laquelle, lesquels, lesquelles choose between known options. With à and de they fuse: auquel, duquel.", "ex": {"fr": "<em>Lequel<\/em> de ces deux pulls préfères-tu ?", "en": "Which of these two sweaters do you prefer?"}}]}, "t91": {"rules": [{"h": "The missed-train si", "p": "si + plus-que-parfait → conditionnel passé. Regret about the past that can't be redone.", "ex": {"fr": "<em>Si nous étions partis<\/em> plus tôt, nous <em>aurions vu<\/em> le coucher de soleil.", "en": "If we'd left earlier, we'd have seen the sunset."}}, {"h": "Mixed conditionals", "p": "Past condition, present result: si + plus-que-parfait → conditionnel présent. The missed chance explains now.", "ex": {"fr": "Si tu <em>avais étudié<\/em>, tu <em>comprendrais<\/em> maintenant.", "en": "If you had studied, you would understand now."}}, {"h": "si beyond if", "p": "si also introduces indirect questions (je me demande si elle viendra), suggestions (si on allait au cinéma ?) and wishes (si seulement il était là !).", "ex": {"fr": "<em>Si on allait<\/em> au cinéma ?", "en": "What if we went to the cinema?"}}], "see": ["t85", "t72"]}, "t92": {"rules": [{"h": "Just in case vs only if", "p": "au cas où takes the conditionnel (au cas où il pleuvrait); à condition que takes the subjunctive (à condition que tu viennes).", "ex": {"fr": "Prends un parapluie <em>au cas où<\/em> il pleuvrait.", "en": "Take an umbrella in case it rains."}}]}, "t93": {"rules": [{"h": "quoique vs quoi que", "p": "quoique = although (quoique ce soit difficile). quoi que = whatever (quoi que tu fasses).", "ex": {"fr": "<em>Quoi que<\/em> tu fasses, sois prudent.", "en": "Whatever you do, be careful."}}, {"h": "quand bien même", "p": "Even if, with a conditionnel in both halves: quand bien même tu refuserais, je comprendrais.", "ex": {"fr": "Quand bien même tu <em>refuserais<\/em>, je comprendrais.", "en": "Even if you refused, I'd understand."}}]}, "t94": {"rules": [{"h": "de peur que, non que", "p": "de peur que + subjunctive = for fear that; non que + subjunctive = not that. Both formal.", "ex": {"fr": "Je me tais <em>de peur qu'il<\/em> se fâche.", "en": "I stay quiet for fear he'll get angry."}}, {"h": "faute de, sous prétexte que", "p": "faute de + noun = for lack of; sous prétexte que = on the pretext that, usually suspicious.", "ex": {"fr": "<em>Faute de<\/em> temps, j'ai abandonné.", "en": "For lack of time, I gave up."}}]}, "t95": {"rules": [{"h": "The novel tense", "p": "il parla, il finit, il vendit, il fut, il eut. Lives in literature and formal history. Recognize it; you rarely need to write it.", "ex": {"fr": "Il <em>fut<\/em> une fois une princesse qui <em>vécut<\/em> seule.", "en": "Once upon a time there was a princess who lived alone."}}, {"h": "Map it to passé composé", "p": "il alla = il est allé, elle dit = elle a dit. Same meanings, older clothes.", "ex": {"fr": "Elle <em>arriva<\/em> à l'aube. (= elle est arrivée)", "en": "She arrived at dawn."}}]}, "t96": {"rules": [{"h": "eut fini, fut parti", "p": "The passé simple of avoir or être + participle: the past right before a passé simple event. Purely literary, and almost always after dès que or quand.", "ex": {"fr": "Dès qu'il <em>eut terminé<\/em>, il partit.", "en": "As soon as he had finished, he left."}}]}, "t97": {"rules": [{"h": "Agree unless the object is indirect", "p": "elles se sont levées agrees. But se parler, se téléphoner, se plaire run on à, which makes the object indirect and kills the agreement: elles se sont parlé.", "ex": {"fr": "Elles se <em>sont souri<\/em>.", "en": "They smiled at each other."}}, {"h": "A following direct object also blocks it", "p": "elle s'est lavé les mains: les mains is the real object, the participle ignores it.", "ex": {"fr": "Elle s'est lavé <em>les mains<\/em>.", "en": "She washed her hands."}}]}, "t98": {"rules": [{"h": "Negation plants doubt", "p": "je pense que goes indicative, but je ne pense pas que flips to subjunctive. Same for il me semble que.", "ex": {"fr": "Je ne crois pas qu'il <em>ait<\/em> raison.", "en": "I don't think he's right."}}, {"h": "Questions open the door", "p": "crois-tu que, est-il possible que lean uncertain, so the subjunctive fits.", "ex": {"fr": "Penses-tu qu'elle <em>vienne<\/em> ?", "en": "Do you think she's coming?"}}]}, "t99": {"rules": [{"h": "The same verb, two worlds", "p": "il est possible que (subjunctive) hedges; il est certain que (indicative) commits. Choose the mood first, the verb second.", "ex": {"fr": "Il est possible qu'il <em>pleuve<\/em> ; il est certain qu'il <em>fait<\/em> gris.", "en": "It may rain; it's certainly grey."}}, {"h": "avant que vs après que", "p": "Before it happens, doubt: avant qu'il parte (subjunctive). After it happens, it's history: après qu'il est parti (indicative).", "ex": {"fr": "<em>avant qu'il ne parte<\/em> / <em>après qu'il est parti<\/em>", "en": "before he leaves / after he left"}}]}, "t100": {"rules": [{"h": "Softening without si", "p": "j'aurais une question, ce serait peut-être mieux, je voudrais comprendre. The conditionnel hedges an opinion or request in polished speech.", "ex": {"fr": "J'<em>aurais<\/em> une question, si vous permettez.", "en": "I'd have a question, if you allow."}}]}, "t101": {"rules": [{"h": "Tight formal prose", "p": "croire savoir, prétendre avoir fini, sans hésiter. Formal French prefers an infinitive clause where speech would use que.", "ex": {"fr": "Il prétend <em>avoir tout vu<\/em>.", "en": "He claims to have seen everything."}}, {"h": "Perception verbs keep the infinitive", "p": "After voir, entendre, regarder, écouter, sentir, the second verb stays an infinitive, never a conjugated form or a que-clause.", "ex": {"fr": "Je l'<em>entends chanter<\/em>.", "en": "I hear her singing."}}]}, "t102": {"rules": [{"h": "The inverted si", "p": "Eût-il su, il serait venu: an old subjunctive, inverted, replaces si. High literature only.", "ex": {"fr": "<em>Eût-il su<\/em>, il <em>serait venu<\/em>.", "en": "Had he known, he would have come."}}, {"h": "fût-ce", "p": "A fossil meaning 'even if it were': je le finirai, fût-ce tard.", "ex": {"fr": "Je le finirai, <em>fût-ce<\/em> tard.", "en": "I'll finish it, even if it's late."}}]}, "t103": {"rules": [{"h": "Two words, three jobs", "p": "quelque + noun = a few (quelque temps); quelque + adjective = however (quelque difficile); quel que + être = whatever (quel que soit le prix).", "ex": {"fr": "<em>Quel que soit<\/em> le prix, je paie.", "en": "Whatever the price, I'll pay."}}]}, "t104": {"rules": [{"h": "à and de fused into lequel", "p": "auquel, duquel, auxquels, desquelles. For things, after verbs that need à or de: penser à, hériter de.", "ex": {"fr": "le projet <em>auquel<\/em> je pense.", "en": "the project I'm thinking about."}}, {"h": "People keep qui", "p": "l'ami avec qui reads warmer than l'ami avec lequel, though both exist.", "ex": {"fr": "un collègue <em>avec qui<\/em> je m'entends bien.", "en": "a colleague I get along with."}}]}, "t105": {"rules": [{"h": "celui de, celle qui, le sien", "p": "Replace a repeated noun with a demonstrative or possessive pronoun; it keeps the noun's gender.", "ex": {"fr": "Ma voiture ? C'est celle <em>de<\/em> ma sœur.", "en": "My car? It's my sister's."}}]}, "t106": {"rules": [{"h": "avoir beau = in vain", "p": "avoir beau + infinitive: no matter how hard one tries, it fails. avoir conjugates like avoir.", "ex": {"fr": "Il <em>a beau<\/em> crier, personne ne l'entend.", "en": "He can shout all he likes, nobody hears him."}}, {"h": "quand bien même = even if", "p": "Both halves usually in conditionnel: quand bien même il pleuvrait, j'irais.", "ex": {"fr": "<em>Quand bien même<\/em> il pleuvrait, j'irais.", "en": "Even if it rained, I'd go."}}]}, "t107": {"rules": [{"h": "ainsi, en effet, or", "p": "ainsi = thus, en effet = indeed, or = yet (formal, nothing to do with 'or').", "ex": {"fr": "<em>Or<\/em>, la situation avait changé.", "en": "Yet the situation had changed."}}, {"h": "The formal mais and donc", "p": "toutefois, néanmoins (however); par conséquent, dès lors (therefore).", "ex": {"fr": "Le budget est faible ; <em>néanmoins<\/em>, on continue.", "en": "The budget is small; nevertheless, we continue."}}]}, "t108": {"rules": [{"h": "The subject-verb flip", "p": "Rarement ai-je vu, à peine est-il arrivé. Formal writing inverts after fronted adverbs like rarement, à peine, peut-être.", "ex": {"fr": "<em>Peut-être viendra-t-<\/em>il demain.", "en": "Perhaps he'll come tomorrow."}}]}, "t109": {"rules": [{"h": "A ne that means nothing", "p": "avant que tu ne partes, de peur qu'il ne pleuve. After certain subjunctive triggers an extra ne appears and adds no negation.", "ex": {"fr": "Je reste jusqu'à ce qu'il <em>ne<\/em> revienne.", "en": "I'm staying until he comes back."}}]}, "t110": {"rules": [{"h": "Hide the actor", "p": "il s'agit de = it's about, il convient de = it is fitting to, il importe de = it matters to. Formal texts dodge je and nous.", "ex": {"fr": "<em>Il convient de<\/em> signaler que le délai expire.", "en": "It should be noted that the deadline expires."}}]}, "t111": {"rules": [{"h": "Two registers, one grammar", "p": "Spoken: on, ça, pas without ne, futur proche. Written: nous, cela, full negation, futur simple.", "ex": {"fr": "<em>On n'y va pas<\/em> ↔ Nous n'y allons pas.", "en": "We're not going (spoken vs written)."}}]}, "t112": {"rules": [{"h": "The full -er paradigm", "p": "je parlai, tu parlas, il parla, nous parlâmes, vous parlâtes, ils parlèrent. The accented endings carry the tense.", "ex": {"fr": "Ils <em>parlèrent<\/em> longuement jusqu'à l'aube.", "en": "They spoke at length until dawn."}}, {"h": "-ir and -re", "p": "je finis, nous finîmes, ils finirent; je vendis, nous vendîmes, ils vendirent. A circumflex marks the nous and vous forms.", "ex": {"fr": "Nous <em>vendîmes<\/em> la maison l'année suivante.", "en": "We sold the house the following year."}}]}, "t113": {"rules": [{"h": "laisser now agrees", "p": "With laisser + infinitive, agreement with a preceding object is now standard: les enfants qu'elle a laissés sortir.", "ex": {"fr": "les enfants qu'elle <em>a laissés<\/em> sortir.", "en": "the children she let go out."}}, {"h": "courir, vivre, mourir", "p": "These agree with a preceding object too: les risques qu'il a courus, la vie qu'ils ont vécue.", "ex": {"fr": "les risques qu'il <em>a courus<\/em>.", "en": "the risks he ran."}}]}, "t114": {"rules": [{"h": "qu'il parlât", "p": "Imperfect subjunctive: stem + -asse, -asses, -ât, -assions, -assiez, -assent. Literature only; it maps one-to-one onto the present subjunctive.", "ex": {"fr": "bien qu'il <em>fût<\/em> tard, ils continuaient.", "en": "although it was late, they carried on."}}], "exc": "Its past twin, the subjonctif plus-que-parfait (qu'il eût parlé), is effectively obsolete — the subjonctif passé does the job in modern French."}, "t115": {"rules": [{"h": "j'eusse parlé", "p": "Same meaning as j'aurais parlé. Identical in shape to the literary pluperfect subjunctive; very formal writing only.", "ex": {"fr": "Si j'<em>eusse su<\/em>, je <em>fusse venu<\/em>.", "en": "Had I known, I would have come."}}]}, "t116": {"rules": [{"h": "A different word per slot", "p": "un grand homme = a great man, un homme grand = a tall man. Before the noun the adjective goes figurative; after it, literal.", "ex": {"fr": "un <em>grand<\/em> homme ≠ un homme <em>grand<\/em>.", "en": "a great man ≠ a tall man."}}, {"h": "The classic pairs", "p": "ancien (former vs antique), cher (dear vs expensive), propre (own vs clean), pauvre (poor soul vs penniless).", "ex": {"fr": "mon <em>pauvre<\/em> ami (regrettable) / un homme <em>pauvre<\/em> (sans argent)", "en": "my poor friend (alas) / a poor man (broke)"}}]}, "t117": {"rules": [{"h": "nul, point, guère", "p": "nul ne = nobody (formal), ne… point = not at all (dated), ne… guère = hardly.", "ex": {"fr": "<em>Nul n'est<\/em> prophète en son pays.", "en": "No one is a prophet in their own land."}}]}, "t118": {"rules": [{"h": "Front it for focus", "p": "Ce jardin, mon grand-père l'avait planté. Left-dislocation lifts the important thing to the head of the sentence.", "ex": {"fr": "<em>Ce jardin<\/em>, mon grand-père l'avait planté.", "en": "That garden, my grandfather had planted it."}}, {"h": "Slow-motion adjectives", "p": "In description, trailing adjectives with commas weigh each one: une robe, verte, éclatante, impossible.", "ex": {"fr": "une robe, <em>verte<\/em>, <em>éclatante<\/em>, impossible.", "en": "a dress, green, dazzling, impossible."}}]}, "t119": {"rules": [{"h": "Old grammar frozen into idiom", "p": "n'en déplaise à, somme toute, quitte à, il n'empêche que. You can't rebuild them from modern rules; learn them whole.", "ex": {"fr": "<em>N'en déplaise à<\/em> ses critiques, son œuvre demeure.", "en": "Much to his critics' displeasure, his work remains."}}]}, "t120": {"rules": [{"h": "Same idea, three outfits", "p": "bagnole (casual), voiture (neutral), véhicule (formal). Pick one register per text and stay in it.", "ex": {"fr": "<em>bagnole<\/em> / <em>voiture<\/em> / <em>véhicule<\/em>", "en": "jalopy / car / vehicle."}}]}};

/* Grid column order (T M N S), N expanded: n nouns & articles,
   a adjectives & adverbs, p pronouns. */
const PARTS = [
  ["T",  "Tense"],
  ["M",  "Mood"],
  ["Nn", "Nouns & articles"],
  ["Na", "Adjectives & adverbs"],
  ["Np", "Pronouns"],
  ["S",  "Sentence"],
];
const LEVELS = ["A1","A2","B1","B2","C1","C2"];

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const groupOf = e => e.cat === "N" ? "N" + e.sub : e.cat;
const partLabel = e => (PARTS.find(([g]) => g === groupOf(e)) || ["", ""])[1];
const entriesFor = level => ENTRIES.filter(e => e.lv === level);   /* taxonomy order */
const drillable = e => e.slugs && e.slugs.length > 0;

/* ── accent-insensitive substring search with highlighting ── */
function normMap(s){
  const chars = [...s], nc = [], startOf = [], endOf = [];
  chars.forEach((ch, oi) => {
    if (/[\u0300-\u036f]/.test(ch)){          // stray combining mark: extends the previous char
      if (endOf.length) endOf[endOf.length-1] = oi + 1;
      return;
    }
    const base = ch.normalize("NFD")[0].toLowerCase();
    nc.push(base);
    startOf[nc.length-1] = oi;
    endOf[nc.length-1] = oi + 1;
  });
  return { n: nc.join(""), chars, startOf, endOf };
}
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function hl(s, q){
  if (!q) return esc(s);
  const { n, chars, startOf, endOf } = normMap(s);
  const qn = norm(q);
  if (!qn) return esc(s);
  const ranges = [];
  let i = n.indexOf(qn);
  while (i !== -1){
    ranges.push([startOf[i], endOf[i + qn.length - 1]]);
    i = n.indexOf(qn, i + qn.length);
  }
  if (!ranges.length) return esc(s);
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged = [ranges[0]];
  for (const r of ranges.slice(1)){
    const last = merged[merged.length-1];
    if (r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push(r);
  }
  let out = "", pos = 0;
  for (const [a,b] of merged){
    out += esc(chars.slice(pos,a).join("")) + "<mark>" + esc(chars.slice(a,b).join("")) + "</mark>";
    pos = b;
  }
  return out + esc(chars.slice(pos).join(""));
}
function matches(e){
  if (!q) return false;
  const qn = norm(q);
  return norm(e.name).includes(qn) || (e.blurb && norm(e.blurb).includes(qn));
}

/* ── state ───────────────────────────────────────────────── */
let level = "A1";
let q = "";

/* ── index screen ─────────────────────────────────────────── */
function renderIndex(){
  const searching = q.trim().length > 0;
  const zoneBody = searching ? "" : `
      <div class="tabbar" role="tablist">
        ${LEVELS.map(l => `<button class="tab" role="tab" aria-selected="${l===level}" data-level="${l}">${l}</button>`).join("")}
      </div>`;

  let body;
  if (searching){
    const hits = ENTRIES.filter(matches);
    body = `<div class="results">
      ${hits.length
        ? `<div class="lessons">${hits.map(e =>
            `<button class="lesson" data-eid="${e.id}"><span class="tt ${drillable(e)?"":"soon"}">${hl(e.name, q)}</span></button>`).join("")}</div>`
        : `<div class="empty"><b>No lesson matches “${esc(q)}”</b>Search covers all lessons, A1–C2.</div>`}
    </div>`;
  } else {
    body = `
    <div class="chapter">
      <h2>Level ${level}</h2>
    </div>
    ${PARTS.map(([g, label]) => {
      const rows = entriesFor(level).filter(e => groupOf(e) === g);
      if (!rows.length) return "";
      return `
      <section class="part">
        <div class="part-h"><span class="pt">${label}</span></div>
        <div class="lessons">${rows.map(e =>
          `<button class="lesson" data-eid="${e.id}"><span class="tt ${drillable(e)?"":"soon"}">${esc(e.name)}</span></button>`).join("")}</div>
      </section>`;
    }).join("")}`;
  }

  document.getElementById("app").innerHTML = `
  <div class="screen">
    <header class="head">
      <h1>Grammar</h1>
    </header>
    <div class="stickyzone">
      <div class="searchrow ${q?"hasq":""}" id="searchrow">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search all lessons…" value="${esc(q)}"
               autocomplete="off" enterkeyhint="search" aria-label="Search all lessons across levels"/>
        <button class="clear" id="clear" aria-label="Clear search">✕</button>
        <span class="kbd">/</span>
      </div>
      ${zoneBody}
    </div>
    ${body}
  </div>`;
  const input = document.getElementById("q");
  input.addEventListener("input", e => {
    q = e.target.value;
    renderIndex();
    const i2 = document.getElementById("q");
    i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length);
  });
  if (window.__focusSearch){
    window.__focusSearch = false;
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

/* ── lesson sheet ─────────────────────────────────────────── */
function ruleBlock(n, r){
  return `<article class="rule">
    <span class="rn">${n}</span>
    <h3>${r.h}</h3>
    <p>${r.p}</p>
    ${r.ex ? `<div class="ex"><div class="fr">${r.ex.fr}</div><div class="en">${r.ex.en}</div></div>` : ""}
  </article>`;
}
function stubBlock(n){
  return `<article class="rule stub">
    <span class="rn">${n}</span>
    <h3>Rule ${n}</h3>
    <p>Full rule sheet for this topic ships with the real build — the prototype authors six topics end-to-end.</p>
  </article>`;
}
function renderTopic(eid){
  const e = ENTRIES.find(x => x.id === eid);
  const r = RULES[e.id];
  const label = partLabel(e);
  const fromSearch = q.trim().length > 0;

  document.getElementById("app").innerHTML = `
  <div class="screen">
    <header class="sheet-head">
      <div class="backrow">
        <button class="back" data-back>← ${fromSearch ? "Search results" : `${e.lv} · ${label}`}</button>
      </div>
      <h2>${esc(e.name)}</h2>
      <div class="metachips">
        <span class="lit">${e.lv}</span><span>${label}</span>
      </div>
    </header>
    <div class="sheet-body">
      ${r ? r.rules.map((x,i)=>ruleBlock(i+1,x)).join("")
          : [1,2,3].map(i=>stubBlock(i)).join("")}
      ${r && r.exc ? `<div class="exc"><p class="lbl">Exception</p><p>${r.exc}</p></div>` : ""}
      ${r && r.see ? `<div class="seealso"><p class="lbl">See also</p><div class="chips">
        ${r.see.map(id => {
          const t = ENTRIES.find(x => x.id === id);
          return t ? `<a data-eid="${t.id}">${esc(t.name)}</a>` : "";
        }).join("")}
      </div></div>` : ""}
      ${drillable(e)
        ? `<a class="cta" href="#">Practice this lesson →</a>`
        : `<span class="notyet">Not drillable yet — joins the practice feed later</span>`}
    </div>
  </div>`;
  window.scrollTo(0,0);
}

/* ── events ───────────────────────────────────────────────── */
document.getElementById("app").addEventListener("click", e => {
  const tab = e.target.closest("[data-level]");
  if (tab){ level = tab.dataset.level; renderIndex(); return; }
  if (e.target.closest("#clear")){ q = ""; window.__focusSearch = true; renderIndex(); return; }
  const topic = e.target.closest("[data-eid]");
  if (topic && topic.dataset.eid){ renderTopic(topic.dataset.eid); return; }
  if (e.target.closest("[data-back]")) renderIndex();
});
document.addEventListener("keydown", e => {
  const inField = document.activeElement === document.getElementById("q");
  if (e.key === "/" && !inField){
    e.preventDefault();
    const i = document.getElementById("q");
    if (i){ window.scrollTo({top:0, behavior:"smooth"}); i.focus(); }
  }
  if (e.key === "Escape" && inField){
    if (q){ q = ""; window.__focusSearch = true; renderIndex(); }
    else document.activeElement.blur();
  }
});
renderIndex();
</script>
</body>
</html>
