<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Knowledge · 3 Parcours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── tokens (from src/styles/tokens.css) ─────────────────── */
:root{
  color-scheme:light;
  --paper:#F6F4EF; --card:#FFFFFF; --ink:#1F1D18; --muted:#6E6A60;
  --faint:#9B968A; --chip:#EBE8E0; --line:#DFDBD2;
  --p0:#E3E1DA; --p1:#C9D3EC; --p2:#4A5AA8; --p3:#232D5C;
  --accent:var(--p2); --accent-soft:#E9EDF8; --accent-ink:#2F3E78;
  --review:#C7531E; --review-text:#A84314; --no-bg:#F9E9DF; --no-ink:#8F3A0D;
  --ok-bg:#E4F0E4; --ok-ink:#216B3D;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-display:30px; --t-xl:23px; --t-lg:19px; --t-md:16px; --t-base:14px;
  --t-sm:13px; --t-xs:12px; --t-2xs:11px;
  --r-sm:7px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:22px; --s-6:32px;
  --shadow-1:0 1px 2px rgba(31,29,24,.08);
  --ease:cubic-bezier(.2,0,0,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#ECEAE3;color:var(--ink);font-family:var(--font);font-size:var(--t-md);line-height:1.6;font-weight:400}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--paper);
     border-inline:1px solid var(--line);position:relative;padding-bottom:96px}
@media(max-width:430px){#app{border-inline:0}}

.proto-pill{position:fixed;bottom:14px;right:14px;z-index:50;background:var(--ink);color:#fff;
  font-size:var(--t-xs);font-weight:700;padding:9px 14px;border-radius:var(--r-pill);
  box-shadow:0 4px 14px rgba(31,29,24,.3)}
.proto-pill:hover{background:#000}

.screen{animation:in .22s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── header ──────────────────────────────────────────────── */
.head{padding:26px var(--s-4) var(--s-4)}
.eyebrow{font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.head h1{font-size:var(--t-display);font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.headstats{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t-xs);
           color:var(--muted);margin:10px 0 6px}
.headstats b{color:var(--ink);font-weight:800;font-size:var(--t-sm)}
.bar{height:6px;background:var(--chip);border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p3));border-radius:var(--r-pill)}
.legend{display:flex;gap:14px;margin-top:10px;font-size:var(--t-2xs);color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* ── milestones ──────────────────────────────────────────── */
.milestone{display:flex;align-items:center;gap:10px;margin:var(--s-5) 0 var(--s-3)}
.milestone .line{flex:1;height:1px;background:var(--line)}
.milestone .tag{font-size:var(--t-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;
                padding:4px 12px;border-radius:var(--r-pill)}
.tag.done{background:var(--ok-bg);color:var(--ok-ink)}
.tag.now{background:var(--ink);color:#fff}
.tag.next{background:var(--chip);color:var(--muted)}
.milestone .n{font-size:var(--t-2xs);color:var(--faint);font-weight:700}

/* ── the rail ────────────────────────────────────────────── */
.trail{position:relative;padding-left:14px}
.trail::before{content:"";position:absolute;left:22px;top:8px;bottom:8px;width:2px;background:var(--line)}
.step{display:grid;grid-template-columns:20px 1fr;gap:14px;align-items:center;position:relative;
      padding:6px 0;width:100%;text-align:left}
.node{width:18px;height:18px;border-radius:50%;background:var(--card);border:2.5px solid var(--chip);
      position:relative;z-index:1;justify-self:center}
.node.s0{border-color:var(--p0)}
.node.s1{border-color:var(--p1)}
.node.s2{border-color:var(--p2);background:var(--p2)}
.node.s3{border-color:var(--p3);background:var(--p3)}
.node.s2::after,.node.s3::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff;opacity:.9}
.node.rev{box-shadow:0 0 0 3px var(--no-bg), 0 0 0 5px var(--review)}
.node.here{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--accent-soft)}50%{box-shadow:0 0 0 7px var(--accent-soft)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:11px 14px;box-shadow:var(--shadow-1);transition:transform .1s var(--ease)}
.card:active{transform:scale(.99);background:var(--accent-soft)}
.card .r1{display:flex;align-items:baseline;gap:8px}
.card .tt{font-size:var(--t-base);font-weight:700;line-height:1.3;flex:1}
.card .lv{font-size:var(--t-2xs);font-weight:800;color:var(--muted)}
.card .hint{font-size:var(--t-xs);color:var(--faint);line-height:1.45;margin-top:2px;
            display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card.nextup{background:var(--accent-soft);border-color:var(--accent);}
.card.nextup .flag{display:inline-block;font-size:var(--t-2xs);font-weight:800;letter-spacing:.1em;
                   text-transform:uppercase;color:var(--accent-ink);margin-bottom:2px}
.card .pip{flex:none;font-size:var(--t-2xs);font-weight:800;color:var(--review-text);background:var(--no-bg);
           border-radius:var(--r-sm);padding:1px 6px}
.done .card .tt{color:var(--muted)}

/* ── sticky continue ─────────────────────────────────────── */
.continue{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);
          padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%)}
.continue button{width:100%;background:var(--ink);color:#fff;font-weight:800;font-size:var(--t-md);
                 padding:15px;border-radius:var(--r-lg);box-shadow:0 6px 18px rgba(31,29,24,.25)}
.continue button small{display:block;font-size:var(--t-2xs);font-weight:600;opacity:.6;letter-spacing:.06em}
.continue button:active{transform:scale(.99)}

/* ── step sheet (topic page) ─────────────────────────────── */
.sheet-head{padding:16px var(--s-4) 0}
.backrow{display:flex;justify-content:space-between;align-items:center}
.back{font-size:var(--t-sm);font-weight:700;color:var(--accent-ink);padding:8px 12px 8px 0}
.crumbs{font-size:var(--t-xs);font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stepbar{margin:6px 0 14px}
.stepbar .row{display:flex;justify-content:space-between;font-size:var(--t-2xs);color:var(--muted);
              font-weight:700;margin-bottom:4px}
.stepbar .bar{height:4px}
.sheet-head h2{font-size:var(--t-display);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:4px 0 6px}
.sheet-head .desc{color:var(--muted);font-size:var(--t-base);line-height:1.55}
.sheet-body{padding:var(--s-4)}
.rule{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:var(--s-4);margin-bottom:var(--s-3);box-shadow:var(--shadow-1)}
.rule .rn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
  font-size:var(--t-sm);font-weight:800;margin-bottom:8px}
.rule h3{font-size:var(--t-md);font-weight:800;line-height:1.35;margin-bottom:6px}
.rule p{font-size:var(--t-base)}
.ex{margin-top:10px;padding:10px 12px;background:#F2F7FD;border-radius:var(--r-md);border-left:3px solid var(--p2)}
.ex .fr{font-size:var(--t-base);font-weight:700}
.ex .fr em{font-style:normal;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 3px}
.ex .en{font-size:var(--t-xs);color:var(--muted);margin-top:2px}
.exc{background:var(--no-bg);border-radius:var(--r-lg);padding:var(--s-4);margin:var(--s-3) 0}
.exc .lbl{font-size:var(--t-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--review-text)}
.exc p{font-size:var(--t-base);color:var(--no-ink);margin-top:4px}
.seealso{margin:var(--s-4) 0 var(--s-2)}
.seealso .lbl{font-size:var(--t-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.seealso .chips{display:flex;flex-wrap:wrap;gap:8px}
.seealso a{font-size:var(--t-sm);font-weight:700;color:var(--accent-ink);background:var(--accent-soft);
           padding:7px 12px;border-radius:var(--r-pill)}
.nextstep{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;font-weight:800;
          font-size:var(--t-md);padding:15px;border-radius:var(--r-lg);margin-top:var(--s-3)}
.nextstep small{display:block;font-size:var(--t-2xs);font-weight:600;opacity:.6;letter-spacing:.06em;margin-bottom:2px}
.ghost{display:block;text-align:center;border:1.5px solid var(--ink);border-radius:var(--r-lg);
       font-weight:700;font-size:var(--t-base);padding:12px;margin-top:var(--s-2)}
.rule.stub{border-style:dashed;background:transparent;box-shadow:none}
.rule.stub p{color:var(--faint)}
</style>
</head>

<script>
const TOPICS = [{"slug": "pc-etre", "title": "Passé composé with être", "blurb": "Forming the passé composé with être and making the participle agree with the subject (elle est allée, ils sont partis).", "levels": ["A2", "B1"], "section": "Tense"}, {"slug": "pc-aux", "title": "Auxiliary choice", "blurb": "Choosing between être and avoir in the passé composé (elle est tombée, not elle a tombée).", "levels": ["A2"], "section": "Tense"}, {"slug": "imparfait-vs-pc", "title": "Imparfait vs passé composé", "blurb": "Choosing the imparfait for background and habits versus the passé composé for events (pendant que je dormais… le téléphone a sonné).", "levels": ["A2", "B1"], "section": "Tense"}, {"slug": "pronouns-cod-coi", "title": "Object pronouns", "blurb": "Replacing direct and indirect objects with le, la, les, lui, leur and placing them before the verb (Je la connais, Tu lui téléphones).", "levels": ["A2", "B1"], "section": "Nouns"}, {"slug": "subjonctif", "title": "Subjonctif after feelings and doubt", "blurb": "Using the subjonctif after expressions of feeling, doubt and necessity (je doute qu'il ait raison, je suis content que tu viennes).", "levels": ["B1"], "section": "Mood"}, {"slug": "pc-avoir", "title": "Passé composé with avoir", "blurb": "Forming the passé composé with avoir and the past participle (nous avons mangé).", "levels": ["A1", "A2"], "section": "Tense"}, {"slug": "imparfait", "title": "Imparfait forms", "blurb": "Forming the imparfait of common verbs (je parlais, nous étions, elles venaient).", "levels": ["A1", "A2"], "section": "Tense"}, {"slug": "pronoun-y", "title": "The pronoun y", "blurb": "Replacing à + place with y and placing it before the verb (elle va à Paris → elle y va).", "levels": ["B1"], "section": "Nouns"}, {"slug": "cest-vs-il-est", "title": "C'est vs il/elle est", "blurb": "Choosing between c'est + noun and il/elle est + adjective (c'est une bonne idée, c'est évident).", "levels": ["A1", "A2"], "section": "Sentence"}, {"slug": "negation", "title": "Negation", "blurb": "Wrapping the conjugated verb in ne … pas (elle ne parle pas anglais).", "levels": ["A1"], "section": "Sentence"}, {"slug": "accord-antepose", "title": "Agreement with preceding object", "blurb": "Making the participle agree when the direct object precedes the verb (les fleurs que j'ai achetées).", "levels": ["B1"], "section": "Tense"}, {"slug": "present-etre-avoir", "title": "Present: être & avoir", "blurb": "The two essential present-tense verbs: je suis, tu es… and j'ai, tu as… with simple complements.", "levels": ["A1"], "section": "Tense"}, {"slug": "present-er-verbs", "title": "Present: -er verbs", "blurb": "The regular -er pattern that covers most French verbs: je parle, tu parles, il parle, nous parlons, vous parlez, ils parlent.", "levels": ["A1"], "section": "Tense"}, {"slug": "present-irregulars", "title": "Present: common irregular verbs", "blurb": "The everyday irregulars a learner meets first: aller, faire, venir, prendre, dire, savoir, voir, sortir, comprendre, lire.", "levels": ["A1"], "section": "Tense"}, {"slug": "present-pronominal", "title": "Present: pronominal verbs", "blurb": "Reflexive verbs with the agreeing pronoun: je me lève, tu te lèves, il s'appelle — including the m'/t'/s' elision.", "levels": ["A1"], "section": "Tense"}, {"slug": "etre-en-train-de", "title": "Être en train de", "blurb": "Saying what is happening right now: elle est en train de manger — être en train de + infinitive.", "levels": ["A1"], "section": "Tense"}, {"slug": "futur-proche", "title": "Futur proche", "blurb": "The near future with aller + infinitive: je vais partir demain, nous allons manger.", "levels": ["A1"], "section": "Tense"}, {"slug": "passe-recent", "title": "Passé récent", "blurb": "The recent past with venir de + infinitive: je viens de finir, elle vient de partir.", "levels": ["A1"], "section": "Tense"}, {"slug": "imperative", "title": "Imperative", "blurb": "Giving commands: parle !, mangez !, allons-y — tu/nous/vous forms without the subject, and ne … pas around them.", "levels": ["A1"], "section": "Mood"}, {"slug": "polite-conditionnel", "title": "Polite conditionnel", "blurb": "Making requests soft with je voudrais — the polite way to want (je voudrais un café, s'il vous plaît).", "levels": ["A1"], "section": "Mood"}, {"slug": "modal-verbs-infinitive", "title": "Pouvoir, vouloir, devoir + infinitive", "blurb": "The three essential modals: je peux, je veux, je dois + a second verb that stays in the infinitive.", "levels": ["A1"], "section": "Mood"}, {"slug": "il-faut-infinitive", "title": "Il faut + infinitive", "blurb": "Expressing necessity impersonally: il faut partir, il faut finir — one form, no person.", "levels": ["A1"], "section": "Mood"}, {"slug": "pour-infinitive", "title": "Pour + infinitive", "blurb": "Saying what something is for: je lis pour apprendre — pour + infinitive (never par).", "levels": ["A1"], "section": "Mood"}, {"slug": "gender-of-nouns", "title": "Gender of nouns", "blurb": "Every French noun is masculine or feminine, and the article shows it: un problème, une idée.", "levels": ["A1"], "section": "Nouns"}, {"slug": "plural-of-nouns", "title": "Plural of nouns", "blurb": "Making nouns plural: most take -s, but -eau takes -x, -al takes -aux, and -s/-x/-z don't change.", "levels": ["A1"], "section": "Nouns"}, {"slug": "definite-indefinite-articles", "title": "Definite & indefinite articles", "blurb": "un/une/des versus le/la/les (l' before a vowel) — choosing the article that fits the noun and the meaning.", "levels": ["A1"], "section": "Nouns"}, {"slug": "partitive-articles", "title": "Partitive articles", "blurb": "Saying some with food and quantities: du pain, de la confiture, de l'eau — and the negative that turns them into de.", "levels": ["A1"], "section": "Nouns"}, {"slug": "adjective-agreement", "title": "Adjective agreement", "blurb": "Adjectives match their noun's gender and number: un garçon grand, une fille grande, des filles grandes.", "levels": ["A1"], "section": "Nouns"}, {"slug": "adjective-position", "title": "Adjective position", "blurb": "Most adjectives follow the noun (une voiture rouge), but the BAGS crowd — beauty, age, goodness, size — goes before (une grande maison).", "levels": ["A1"], "section": "Nouns"}, {"slug": "possessive-adjectives", "title": "Possessive adjectives", "blurb": "mon/ma/mes, ton/ta/tes, son/sa/ses… — agreeing with the thing owned, not the owner (son frère, even for Marie).", "levels": ["A1"], "section": "Nouns"}, {"slug": "demonstrative-adjectives", "title": "Demonstrative adjectives", "blurb": "Pointing at things: ce chien, cet arbre, cette table, ces livres — with the cet-before-a-vowel rule.", "levels": ["A1"], "section": "Nouns"}, {"slug": "quantity-adverbs", "title": "Quantity & intensity adverbs", "blurb": "très + adjective (très content) versus beaucoup de + noun (beaucoup d'amis) — the pairing learners mix up.", "levels": ["A1"], "section": "Nouns"}, {"slug": "subject-pronouns", "title": "Subject pronouns & on", "blurb": "Replacing subjects with je, tu, il, elle, nous, vous, ils, elles — and the informal on that takes a 3rd-person form.", "levels": ["A1"], "section": "Nouns"}, {"slug": "stressed-pronouns", "title": "Stressed pronouns", "blurb": "The strong forms after prepositions and after c'est: avec moi, pour toi, c'est lui, c'est eux.", "levels": ["A1"], "section": "Nouns"}, {"slug": "three-question-forms", "title": "Three question forms", "blurb": "Asking three ways: intonation (tu vas bien ?), est-ce que (est-ce que tu vas bien ?), and inversion (vas-tu bien ?).", "levels": ["A1"], "section": "Sentence"}, {"slug": "question-words", "title": "Question words", "blurb": "qui, que, où, quand, comment, pourquoi, combien — the words that open questions, in inversion and est-ce que forms.", "levels": ["A1"], "section": "Sentence"}, {"slug": "il-ya-cest-voila", "title": "Il y a, c'est, voilà", "blurb": "Presenting and pointing: il y a deux chiens (there are), c'est mon ami, voilà le train — and the il y a / il a trap.", "levels": ["A1"], "section": "Sentence"}, {"slug": "dans-depuis-il-ya", "title": "Dans, depuis, il y a", "blurb": "Three time expressions learners swap wrongly: dans (in, future), depuis (since/for, ongoing), il y a (ago, past).", "levels": ["A1"], "section": "Sentence"}, {"slug": "prepositions-place", "title": "Prepositions of place", "blurb": "Where things and people are: à Paris, en France, au Japon, chez Marie, dans le sac, sur la table.", "levels": ["A1"], "section": "Sentence"}, {"slug": "prepositions-time", "title": "Prepositions of time", "blurb": "When things happen: avant le dîner, après le cours, pendant les vacances, sous la pluie.", "levels": ["A1"], "section": "Sentence"}, {"slug": "connectors-basic", "title": "Et, ou, mais, alors", "blurb": "The four connectors that shape a sentence: and, or, but, so — chosen by the relation between the clauses.", "levels": ["A1"], "section": "Sentence"}, {"slug": "futur-simple", "title": "Futur simple", "blurb": "Talking about tomorrow and later: endings -ai, -as, -a, -ons, -ez, -ont on the stem, irregulars included (je serai, j'irai, je ferai).", "levels": ["A2"], "section": "Tense"}, {"slug": "verbs-prepositions", "title": "Verbs with prepositions", "blurb": "Which preposition joins the conjugated verb to its infinitive: aider à, apprendre à, réussir à, versus décider de, essayer de, oublier de.", "levels": ["A2"], "section": "Mood"}, {"slug": "comparative", "title": "Comparative", "blurb": "Comparing with plus/moins/aussi … que (le TGV est plus rapide que le vélo) — plus for more, moins for less, aussi for equal.", "levels": ["A2"], "section": "Nouns"}, {"slug": "superlative", "title": "Superlative", "blurb": "The extreme form: le/la/les plus + adjective agreeing with the noun (la plus belle), and bon → meilleur, mauvais → pire.", "levels": ["A2"], "section": "Nouns"}, {"slug": "pronoun-en", "title": "The pronoun en", "blurb": "Replacing de + thing with en before the verb (j'en parle, tu en manges) — and the j'en elision trap.", "levels": ["A2"], "section": "Nouns"}, {"slug": "uses-of-on", "title": "Uses of on", "blurb": "Beyond on = nous: on for people in general (ici on parle français) — always with the 3rd-person singular form.", "levels": ["A2"], "section": "Nouns"}, {"slug": "qui-que-ou", "title": "Qui, que, où", "blurb": "Joining clauses with relative pronouns: qui for the subject, que for the object, où for place and time (la ville où j'habite).", "levels": ["A2"], "section": "Nouns"}, {"slug": "possessive-pronouns", "title": "Possessive pronouns", "blurb": "The standing-alone possessives: le mien, la mienne, les nôtres — gender and number come from the thing, not the owner.", "levels": ["A2"], "section": "Nouns"}, {"slug": "tout-toute-tous", "title": "Tout, toute, tous, toutes", "blurb": "The four faces of tout: tout le temps, toute la journée, tous les amis, toutes les fenêtres — agreeing with what follows.", "levels": ["A2"], "section": "Nouns"}, {"slug": "ca-cela-ceci", "title": "Ça, cela, ceci", "blurb": "Pointing without a noun: ceci (this, near), cela/ça (that, general) — and when everyday ça replaces both.", "levels": ["A2"], "section": "Nouns"}, {"slug": "ne-plus-rien-personne", "title": "Ne… plus, rien, personne", "blurb": "Negation beyond ne … pas: ne … plus (not anymore), ne … rien (nothing), ne … personne (nobody) — same wrapping, stronger meanings.", "levels": ["A2"], "section": "Sentence"}, {"slug": "exclamations", "title": "Exclamations", "blurb": "Exclaiming: quel agreeing with its noun (quelle belle vue !) and que/comme as intensifiers (qu'il fait chaud !).", "levels": ["A2"], "section": "Sentence"}, {"slug": "cause-consequence", "title": "Cause & consequence", "blurb": "Linking cause and result: parce que before the cause (parce qu'il pleut), donc before the result, à cause de + noun for blame.", "levels": ["A2"], "section": "Sentence"}, {"slug": "purpose-opposition", "title": "Purpose & const RULES  = {"imparfait-vs-pc": {"rules": [{"h": "Background vs event", "p": "The imparfait paints the scene — weather, hour, ongoing states. The passé composé reports what happened and moved things forward.", "ex": {"fr": "Il <em>pleuvait</em> quand le téléphone <em>a sonné</em>.", "en": "It was raining when the phone rang."}}, {"h": "Habit vs single occurrence", "p": "Repeated or habitual actions take the imparfait; a countable, completed occurrence takes the passé composé.", "ex": {"fr": "Le samedi, nous <em>allions</em> au marché — mais hier nous <em>sommes allés</em> au supermarché.", "en": "On Saturdays we would go to the market — but yesterday we went to the supermarket."}}, {"h": "Interruptions split the sentence", "p": "An imparfait action interrupted by a passé composé event is the classic narrative pattern — pendant que… is your clue.", "ex": {"fr": "Je <em>dormais</em> quand elle <em>est entrée</em>.", "en": "I was sleeping when she came in."}}], "exc": "Some verbs change meaning between the two: « J’ai connu Marie en 2010 » (I met her) vs « Je connaissais Marie » (I already knew her). Same shift for savoir, pouvoir, vouloir.", "see": ["imparfait", "pc-avoir", "pc-etre"]}, "futur-proche": {"rules": [{"h": "Aller + infinitive", "p": "Conjugate aller in the present and leave the main verb as an infinitive — that is the whole machinery.", "ex": {"fr": "Je <em>vais</em> partir à midi.", "en": "I’m leaving at noon."}}, {"h": "Plans and near certainty", "p": "Futur proche is the default for plans, intentions and anything that feels immediate or already decided.", "ex": {"fr": "On <em>va</em> regarder un film ce soir.", "en": "We’re going to watch a film tonight."}}, {"h": "Negation wraps the conjugated verb", "p": "Ne … pas goes around aller, not around the infinitive.", "ex": {"fr": "Je <em>ne vais pas</em> venir.", "en": "I’m not going to come."}}], "exc": "In conversation the futur proche often replaces the futur simple even for the far future: « Je vais avoir 30 ans l’année prochaine ».", "see": ["futur-simple", "passe-recent", "imparfait"]}, "pronoun-en": {"rules": [{"h": "En replaces de + thing", "p": "When a verb takes de + something inanimate, en stands in for the whole phrase and sits before the verb.", "ex": {"fr": "Tu veux du café ? — J’<em>en</em> veux bien.", "en": "Do you want coffee? — I’d like some."}}, {"h": "En carries quantities", "p": "Numbers and quantity words stay in place; only the noun is replaced by en.", "ex": {"fr": "Combien d’enfants avez-vous ? — J’<em>en</em> ai deux.", "en": "How many children do you have? — I have two."}}, {"h": "En replaces de + place of origin", "p": "With verbs like venir, en stands for the place you come from.", "ex": {"fr": "Tu viens de Paris ? — Oui, j’<em>en</em> viens.", "en": "Coming from Paris? — Yes, I am."}}], "exc": "People are never replaced by en: « Je parle de Marie » → « Je parle d’elle », never *« J’en parle ».", "see": ["pronouns-cod-coi", "pronoun-y"]}, "subjonctif": {"rules": [{"h": "Feelings, wants and doubt trigger it", "p": "After an expression of emotion, will, necessity or doubt + que, the verb moves into the subjonctif.", "ex": {"fr": "Je suis content que tu <em>viennes</em>.", "en": "I’m glad you’re coming."}}, {"h": "Learn the trigger list", "p": "il faut que · bien que · avant que · pour que · je doute que… — the subjonctif follows. The triggers are the rule.", "ex": {"fr": "Il faut que tu <em>sois</em> là à 8h.", "en": "You have to be there at 8."}}, {"h": "Negated opinion flips it", "p": "Affirmative croire / penser take the indicative; negated — or douter — open the door to doubt.", "ex": {"fr": "Je pense qu’il <em>a</em> raison · Je ne pense pas qu’il <em>ait</em> raison.", "en": "I think he’s right · I don’t think he is."}}], "exc": "Espérer keeps the indicative despite looking like a wish: « J’espère qu’il vient », never « qu’il vienne ».", "see": ["subjonctif-forms", "subjonctif-vs-indicatif"]}, "si-imparfait": {"rules": [{"h": "Si + imparfait → conditionnel présent", "p": "An unreal or unlikely present/future hypothesis: si-clause in the imparfait, outcome in the conditionnel.", "ex": {"fr": "Si j’<em>avais</em> le temps, je <em>voyagerais</em>.", "en": "If I had time, I would travel."}}, {"h": "Never conditionnel inside the si-clause", "p": "The conditionnel lives in the result clause only — « si j’aurais » is the classic learner error.", "ex": {"fr": "Si on <em>perdait</em> ce match, on <em>serait</em> éliminés.", "en": "If we lost this match, we’d be out."}}, {"h": "Meaning: contrary to now", "p": "The imparfait signals that the hypothesis runs against present reality.", "ex": {"fr": "Si je <em>savais</em> sa réponse, je <em>serais</em> tranquille.", "en": "If I knew his answer, I’d be at ease."}}], "exc": "When si means « whether », it introduces an indirect question with normal tenses: « Je me demande s’il viendra » — future, no conditionnel.", "see": ["si-present", "si-plus-que-parfait", "conditionnel-uses"]}, "negation": {"rules": [{"h": "Ne … pas wraps the conjugated verb", "p": "Ne (n’) goes before the verb, pas after it — around auxiliaries too.", "ex": {"fr": "Je <em>ne</em> sais <em>pas</em> · Elle <em>n’</em>a <em>pas</em> compris.", "en": "I don’t know · She didn’t understand."}}, {"h": "Infinitives take ne pas up front", "p": "With an infinitive the two words join together before it.", "ex": {"fr": "C’est difficile de <em>ne pas</em> rire.", "en": "It’s hard not to laugh."}}, {"h": "Spoken French drops ne", "p": "In conversation pas alone is the norm; writing keeps both.", "ex": {"fr": "Je sais <em>pas</em>, moi.", "en": "Dunno, me."}}], "exc": "pas swaps seats with rien, personne, jamais: « Je n’ai rien dit » — rien follows the auxiliary where pas would sit.", "see": ["ne-plus-rien-personne", "restriction-ne-que"]}};

const SECTIONS = {Tense:"Tense",Mood:"Mood",Nouns:"Nouns",Sentence:"Sentence"};
const LEVELS = ["A1","A2","B1","B2"];

/* deterministic fake mastery */
function state(slug){
  let h = 0; for (const c of slug) h = (h*33 + c.charCodeAt(0)) >>> 0;
  return { step: h % 5 === 0 ? 0 : 1 + (h % 3), review: h % 7 === 0 };
}
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* path order: by top level, then section order, then title */
const ORDER = TOPICS.slice().sort((a,b)=>{
  const la = LEVELS.indexOf(a.levels[0]), lb = LEVELS.indexOf(b.levels[0]);
  if (la !== lb) return la - lb;
  const sa = Object.keys(SECTIONS).indexOf(a.section), sb = Object.keys(SECTIONS).indexOf(b.section);
  if (sa !== sb) return sa - sb;
  return a.title.localeCompare(b.title,"fr");
});
/* "you are here" — step 35 in the ordered list */
const HERE = 34;

function renderIndex(){
  const done = ORDER.slice(0,HERE).filter(t=>state(t.slug).step>=2).length;
  let lastLevel = null;
  const html = ORDER.map((t,i)=>{
    const lv = t.levels[0];
    let out = "";
    if (lv !== lastLevel){
      lastLevel = lv;
      const lvIdx = LEVELS.indexOf(lv);
      const status = lvIdx < LEVELS.indexOf(ORDER[HERE].levels[0]) ? "done"
                   : lv === ORDER[HERE].levels[0] ? (i >= HERE ? "next" : "now") : "next";
      const tag = status === "done" ? `<span class="tag done">✓ ${lv} complete</span>`
                : status === "now"  ? `<span class="tag now">${lv} · in progress</span>`
                : `<span class="tag next">${lv}</span>`;
      out = `<div class="milestone"><span class="line"></span>${tag}<span class="line"></span></div>`;
    }
    const st = state(t.slug);
    const isHere = i === HERE, isNext = i === HERE + 1;
    const step = t.levels[0] === "A1" || i <= HERE + 1 || st.step > 0;
    const cls = [
      "step",
      st.step === 3 ? "done" : "",
      isHere ? "here" : ""
    ].join(" ");
    return out + `
    <button class="${cls}" data-slug="${t.slug}">
      <span class="node s${st.step} ${st.review?"rev":""} ${isHere?"here":""}"></span>
      <span class="card ${isNext?"nextup":""}">
        ${isNext?`<span class="flag">Next up</span>`:""}
        <span class="r1">
          <span class="tt">${i <= HERE || st.step>0 ? esc(t.title) : esc(t.title)}</span>
          ${st.review && !isNext?`<span class="pip">review</span>`:""}
          <span class="lv">${t.levels.join("·")}</span>
        </span>
        ${step || isNext ? `<span class="hint">${esc(t.blurb)}</span>` : ""}
      </span>
    </button>`;
  }).join("");

  document.getElementById("app").innerHTML = `
  <div class="screen">
    <header class="head">
      <p class="eyebrow">Knowledge</p>
      <h1>The path</h1>
      <div class="headstats">
        <span><b>${HERE+1}</b> / ${ORDER.length} steps · <b>${done}</b> solid</span>
        <span>${ORDER[HERE].levels[0]} in progress</span>
      </div>
      <div class="bar"><i style="width:${Math.round((HERE+1)/ORDER.length*100)}%"></i></div>
      <div class="legend">
        <span><i style="background:var(--p0)"></i>untouched</span>
        <span><i style="background:var(--p1)"></i>learning</span>
        <span><i style="background:var(--p2)"></i>solid</span>
        <span><i style="background:var(--p3)"></i>mastered</span>
        <span><i style="box-shadow:0 0 0 2px var(--review)"></i>review</span>
      </div>
    </header>
    <div class="trail">${html}</div>
    <p style="text-align:center;font-size:var(--t-2xs);color:var(--faint);padding:18px 0 8px;font-weight:700">
      Every step stays open — the path suggests, it never locks</p>
  </div>
  <div class="continue"><button data-slug="${ORDER[HERE].slug}">
    Continue the path
    <small>step ${HERE+1} · ${esc(ORDER[HERE].title)}</small>
  </button></div>`;
  window.scrollTo(0,0);
}

/* ── step sheet ──────────────────────────────────────────── */
function renderTopic(slug){
  const i = ORDER.findIndex(x=>x.slug===slug);
  const t = ORDER[i];
  const r = RULES[slug];
  const prev = ORDER[i-1], next = ORDER[i+1];
  document.getElementById("app").innerHTML = `
  <div class="screen">
    <header class="sheet-head">
      <div class="backrow">
        <button class="back" data-back>← The path</button>
        <span class="crumbs">${SECTIONS[t.section]} · ${t.levels.join(" · ")}</span>
      </div>
      <div class="stepbar">
        <div class="row"><span>Étape ${i+1} / ${ORDER.length}</span><span>${Math.round((i+1)/ORDER.length*100)}%</span></div>
        <div class="bar"><i style="width:${Math.round((i+1)/ORDER.length*100)}%"></i></div>
      </div>
      <h2>${esc(t.title)}</h2>
      <p class="desc">${esc(t.blurb)}</p>
    </header>
    <div class="sheet-body">
      ${r ? r.rules.map((x,n)=>`<article class="rule">
          <span class="rn">${n+1}</span><h3>${x.h}</h3><p>${x.p}</p>
          ${x.ex?`<div class="ex"><div class="fr">${x.ex.fr}</div><div class="en">${x.ex.en}</div></div>`:""}
        </article>`).join("")
        : [1,2,3].map(n=>`<article class="rule stub"><span class="rn">${n}</span><h3>Rule ${n}</h3>
          <p>Full rule sheet ships with the real build.</p></article>`).join("")}
      ${r && r.exc ? `<div class="exc"><p class="lbl">Exception</p><p>${r.exc}</p></div>` : ""}
      ${r && r.see ? `<div class="seealso"><p class="lbl">On the path nearby</p><div class="chips">
        ${r.see.map(s=>`<a data-slug="${s}">${esc((TOPICS.find(t=>t.slug===s)||{title:s}).title)}</a>`).join("")}
      </div></div>` : ""}
      <button class="nextstep" data-slug="${next ? next.slug : ""}">
        <small>next · étape ${i+2}</small>${next ? esc(next.title) : "End of the path"}
      </button>
      <a class="ghost" href="#">Practice this step first</a>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

/* ── events ──────────────────────────────────────────────── */
document.getElementById("app").addEventListener("click", e => {
  const el = e.target.closest("[data-slug]");
  if (el && el.dataset.slug){ renderTopic(el.dataset.slug); return; }
  if (e.target.closest("[data-back]")) renderIndex();
});
renderIndex();
</script>
</body>
</html>
